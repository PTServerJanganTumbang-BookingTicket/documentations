  /events/{event_id}/queue/me:
    get:
      tags:
      - Queue
      summary: Get Queue State (Re-entrancy)
      operationId: getQueueMe
      description: |-
        Re-entrancy. Satu-satunya endpoint yang dipanggil klien saat kembali (refresh, ganti tab, kembali dari aplikasi bank). Ini READ: tanpa CAPTCHA dan tidak dihitung terhadap batas join (api-contracts §3.3).

        ## `data.state`

        | `state` | Arti | Field `data` | Yang dilakukan frontend |
        |---|---|---|---|
        | `QUEUED` | Masih mengantre, giliran belum tiba | `ticket_no`, `now_serving` | Waiting Room. `ticket_no ≤ now_serving` berarti grant sedang ditulis: ulangi setelah ±1 detik |
        | `GRANTED` | Giliran tiba, halaman tiket belum dibuka | `grant_token`, `booking_expires_at`, `server_time` | Simpan `grant_token`, buka Detail Ticket. Hitung mundur 5 menit **sudah berjalan** sejak giliran diberikan |
        | `SELECTING` | Sedang memilih tiket, belum menekan Bayar | `grant_token`, `booking_id`, `booking_expires_at`, `server_time` | Detail Ticket, hitung mundur dilanjutkan dari `booking_expires_at` |
        | `HELD` | Tombol Bayar sudah ditekan, kursi dan NIK di-hold, pembayaran belum dimulai (v2.27) | `grant_token`, `booking_id`, `payment_expires_at`, `server_time` | Payment Page (pilih metode). Hitung mundur 10 menit dari `payment_expires_at`, **bukan** `booking_expires_at` |
        | `AWAITING_PAYMENT` | Pembayaran sudah dimulai (VA / e-wallet), menunggu customer membayar | `grant_token`, `booking_id`, `payment_expires_at`, `payment_ref`, `server_time` | Payment Page, hitung mundur dari `payment_expires_at`, polling `GET /payments/{booking_id}/status`. **Lihat aturan verifikasi di bawah** |
        | `CONFIRMED` | Sudah lunas | `booking_id` | Halaman tiket / Success Page. Dijawab dari nisan bila token antrian sudah dihapus; klien menghapus queue_token event ini |
        | `EXPIRED` | Selesai tanpa tiket: giliran tidak dipakai (`LAPSED`), waktu memilih atau membayar habis (`EXPIRED`), atau dibatalkan (`ABANDONED`) | — | Layar kedaluwarsa. Tombol "Antre lagi" memanggil join, yang memberi tempat baru di belakang dan `queue_token` baru (v2.29) |

        ## Aturan verifikasi pembayaran (`AWAITING_PAYMENT` setelah tenggat)

        Bila `state` = `AWAITING_PAYMENT` dan `payment_expires_at` ≤ jam server (`server_time` + selisih jam), tenggat sudah lewat tetapi pembayaran detik terakhir masih bisa masuk (grace 30 detik, lalu backend memeriksa ke Midtrans). Frontend:

        1. tampilkan **"Memverifikasi pembayaran…"**, tanpa hitung mundur, **bukan** layar kedaluwarsa;
        2. sembunyikan "ganti metode" dan "bayar lagi";
        3. terus polling `GET /payments/{booking_id}/status` setiap 2–3 detik, melewati `payment_expires_at`: `PAID` → Success Page; `EXPIRED` atau `401 GRANT_TOKEN_INVALID` → panggil `/queue/me` lagi (menjawab `EXPIRED`) → layar kedaluwarsa.

        Aturan yang sama berlaku saat hitung mundur di Payment Page mencapai 0, dan untuk `PENDING_PAYMENT` pada `GET /bookings/{booking_id}`.

        ## Catatan

        - Hitung mundur selalu dari tenggat server (`booking_expires_at`, `payment_expires_at`) dan `server_time`; tenggat tidak pernah bergeser.
        - Field yang tidak tercantum untuk sebuah `state` tidak dikirim.
        - Tamu wajib `X-Device-Id`: perangkat lain → `401 DEVICE_MISMATCH`; tanpa header → `400 DEVICE_ID_REQUIRED`.
      parameters:
      - name: event_id
        in: path
        required: true
        schema:
          type: string
        example: evt_konser_a
      - name: X-Queue-Token
        in: header
        required: false
        description: 'Token ruang tunggu (web dan mobile). v2.28: tidak ada cookie.'
        schema:
          type: string
        example: qt_xyz789
      - name: Authorization
        in: header
        required: false
        description: Bearer {access_token} — pemulihan lintas perangkat untuk customer login (token tersimpan hilang, incognito,
          app di-install ulang). Respons tidak membawa queue_token; untuk stream panggil join (BR-07) atau polling /queue/serving.
          Tamu tidak punya ini.
        schema:
          type: string
      responses:
        '200':
          description: Queue state
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    type: object
                    properties:
                      code:
                        type: integer
                        example: 200
                      message:
                        type: string
                        example: Success
                      server_time:
                        type: string
                        format: date-time
                        example: '2026-11-03T09:12:00.412Z'
                        description: Jam server, ada di SETIAP respons (BR-10)
                    required:
                    - code
                    - message
                    - server_time
                  data:
                    type: object
                    properties:
                      state:
                        type: string
                        example: QUEUED
                        enum:
                        - QUEUED
                        - GRANTED
                        - SELECTING
                        - HELD
                        - AWAITING_PAYMENT
                        - CONFIRMED
                        - EXPIRED
                        description: Keadaan customer; menentukan halaman tujuan. QUEUED (mengantre) · GRANTED (giliran tiba,
                          halaman tiket belum dibuka) · SELECTING (memilih tiket) · HELD (Bayar ditekan, belum mulai membayar)
                          · AWAITING_PAYMENT (pembayaran berjalan; setelah payment_expires_at = memverifikasi, bukan kedaluwarsa)
                          · CONFIRMED (lunas) · EXPIRED (selesai tanpa tiket). Lihat tabel pada deskripsi endpoint
                      ticket_no:
                        type: integer
                        example: 31842
                        description: Hanya QUEUED
                      now_serving:
                        type: integer
                        example: 31600
                        description: Hanya QUEUED. ticket_no ≤ now_serving = grant pending; ulangi setelah 1 detik
                      grant_token:
                        type: string
                        example: gt_abc123
                        description: GRANTED, SELECTING, HELD, AWAITING_PAYMENT. Kirim sebagai X-Grant-Token
                      booking_id:
                        type: string
                        example: RB-00912
                        description: SELECTING, HELD, AWAITING_PAYMENT, CONFIRMED
                      booking_expires_at:
                        type: string
                        format: date-time
                        description: 'GRANTED, SELECTING: tenggat 5 menit memilih tiket'
                      payment_expires_at:
                        type: string
                        format: date-time
                        description: 'HELD, AWAITING_PAYMENT: tenggat 10 menit pembayaran (sejak tombol Bayar). Sudah lewat
                          pada AWAITING_PAYMENT = sedang diverifikasi, bukan kedaluwarsa'
                      payment_ref:
                        type: string
                        example: pay_123
                        description: Hanya AWAITING_PAYMENT
                      server_time:
                        type: string
                        format: date-time
                        description: Pasangan jam untuk tenggat di atas
                    required:
                    - state
                required:
                - meta
                - data
              examples:
                Masih mengantre:
                  value:
                    meta:
                      code: 200
                      message: Success
                      server_time: '2026-11-03T09:12:00.412Z'
                    data:
                      state: QUEUED
                      ticket_no: 31842
                      now_serving: 31600
                Giliran tiba:
                  value:
                    meta:
                      code: 200
                      message: Success
                      server_time: '2026-11-03T09:12:00.412Z'
                    data:
                      state: GRANTED
                      grant_token: gt_abc123
                      booking_expires_at: '2026-11-10T02:05:00Z'
                      server_time: '2026-11-10T02:00:00Z'
                Sedang memilih:
                  value:
                    meta:
                      code: 200
                      message: Success
                      server_time: '2026-11-03T09:12:00.412Z'
                    data:
                      state: SELECTING
                      grant_token: gt_abc123
                      booking_id: RB-00912
                      booking_expires_at: '2026-11-10T02:05:00Z'
                      server_time: '2026-11-10T02:01:10Z'
                Kursi di-hold, belum bayar:
                  value:
                    meta:
                      code: 200
                      message: Success
                      server_time: '2026-11-03T09:12:00.412Z'
                    data:
                      state: HELD
                      grant_token: gt_abc123
                      booking_id: RB-00912
                      payment_expires_at: '2026-11-10T02:14:00Z'
                      server_time: '2026-11-10T02:06:00Z'
                Menunggu bayar:
                  value:
                    meta:
                      code: 200
                      message: Success
                      server_time: '2026-11-03T09:12:00.412Z'
                    data:
                      state: AWAITING_PAYMENT
                      grant_token: gt_abc123
                      booking_id: RB-00912
                      payment_expires_at: '2026-11-10T02:14:00Z'
                      payment_ref: pay_123
                      server_time: '2026-11-10T02:04:00Z'
                Selesai:
                  value:
                    meta:
                      code: 200
                      message: Success
                      server_time: '2026-11-03T09:12:00.412Z'
                    data:
                      state: CONFIRMED
                      booking_id: RB-00912
                Expired:
                  value:
                    meta:
                      code: 200
                      message: Success
                      server_time: '2026-11-03T09:12:00.412Z'
                    data:
                      state: EXPIRED
        '401':
          description: UNAUTHORIZED — Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    type: object
                    properties:
                      code:
                        type: integer
                        example: 401
                      message:
                        type: string
                        example: Queue token tidak valid atau tidak ada
                      error_code:
                        type: string
                        example: UNAUTHORIZED
                        description: Kode mesin (Appendix A api-contracts). Hanya pada error
                      server_time:
                        type: string
                        format: date-time
                        example: '2026-11-03T09:12:00.412Z'
                        description: Jam server, ada di SETIAP respons (BR-10)
                    required:
                    - code
                    - message
                    - server_time
                    - error_code
                  data:
                    type: object
                    properties: {}
                required:
                - meta
                - data
              examples:
