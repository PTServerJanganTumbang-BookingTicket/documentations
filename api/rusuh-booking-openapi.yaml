  /bookings:
    post:
      tags:
      - Booking
      summary: Create Booking
      operationId: createBooking
      description: |-
        Create booking.

        v2.14: tickets[].holder_email dihapus; seluruh e-tiket dikirim ke contact_email.

        v2.16: tiap kursi membawa tepat satu dari nik, saved_nik_id, use_account_nik: true.

        v2.17: terms_version dihapus (persetujuan dicatat saat registrasi).

        v2.18: respons 201 sama dengan GET /bookings/{id} PENDING_PAYMENT (tanpa subtotal, service_fee, redirect_url); 200 untuk submit ulang; daftar error lengkap (api-contracts §4.3).

        v2.19: 409 TICKETS_UNAVAILABLE = habis total (queue_state FULL_BOOKED / CLOSED); 409 INSUFFICIENT_STOCK = habis sebagian.

        v2.20: Authorization: Bearer wajib bila grant milik akun login (401 UNAUTHORIZED / TOKEN_EXPIRED / TOKEN_INVALID).

        v2.21: (1) nik dinormalisasi seperti POST /nik/validate (hanya angka, lalu 16 digit). (2) Status booking diperiksa sebelum isi body dan verifikasi NIK: submit ulang pada booking HELD atau lebih jauh selalu 200, juga saat body berubah atau nik-verify gangguan.

        v2.23: (1) 429 TOO_MANY_REQUESTS dihapus; batas laju Dukcapil bersama menjawab 503 DUKCAPIL_UNAVAILABLE. (2) 409 BOOKING_EXPIRED untuk GRANTED maupun SELECTING yang 5 menitnya habis; BOOKING_STATUS_INVALID hanya GRANTED yang masih dalam waktu. (3) TICKETS_UNAVAILABLE.queue_state hanya FULL_BOOKED atau CLOSED; full_booked_at dapat null.
      parameters:
      - name: X-Grant-Token
        in: header
        required: true
        description: Grant slot dari GET /queue/me. Wajib — ini yang menjaga endpoint ini.
        schema:
          type: string
        example: gt_abc123
      - name: X-Device-Id
        in: header
        required: false
        description: Pengikatan device untuk grant anonim — WAJIB bila pemanggil tidak login. Acak 128 bit dari klien; server
          menyimpan HMAC-nya. Tidak cocok → 401 DEVICE_MISMATCH.
        schema:
          type: string
        example: d3f1a9c4b70e42f88a1c5e6072b9d4af
      - name: Authorization
        in: header
        required: false
        description: Bearer access token akun. WAJIB bila grant milik akun login (harus akun yang sama dengan grant); tamu
          tidak mengirimnya. Hilang/akun lain → 401 UNAUTHORIZED, kedaluwarsa → 401 TOKEN_EXPIRED, tidak sah → 401 TOKEN_INVALID
        schema:
          type: string
        example: Bearer eyJhbGciOi…
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - event_id
              - tickets
              properties:
                event_id:
                  type: string
                tickets:
                  type: array
                  minItems: 1
                  maxItems: 3
                  items:
                    type: object
                    required:
                    - category_id
                    properties:
                      category_id:
                        type: string
                      nik:
                        type: string
                        description: 'NIK yang diketik, dinormalisasi seperti POST /nik/validate: semua karakter selain angka
                          dibuang (spasi, titik, tanda hubung), lalu wajib tepat 16 digit; selain itu 400 VALIDATION_ERROR
                          + data.index. Tepat satu dari nik, saved_nik_id, use_account_nik per kursi'
                      saved_nik_id:
                        type: string
                        example: snk_1
                        description: Id entri Daftar NIK Teman milik customer login (GET /accounts/me/saved-niks). Tidak dikenal
                          / milik akun lain / tamu → 400 VALIDATION_ERROR + data.index
                      use_account_nik:
                        type: boolean
                        example: true
                        description: true = kursi ini memakai NIK terdaftar milik customer login. Paling banyak satu kursi;
                          akun harus punya NIK terverifikasi; tamu → 400 VALIDATION_ERROR + data.index
                    description: Tepat satu dari nik, saved_nik_id, use_account_nik
                  description: 'Satu per kursi (maks 3 total, lintas kategori). Tanpa holder_email sejak v2.14: seluruh e-tiket
                    dikirim ke contact_email'
                contact_email:
                  type: string
                  format: email
                  description: Email pembeli; seluruh e-tiket booking ini dikirim ke sini (FR-26 diubah, ADR-006 §8.15)
            example:
              event_id: evt_konser_a
              tickets:
              - category_id: cat_vip
                use_account_nik: true
              - category_id: cat_vip
                saved_nik_id: snk_1
              - category_id: cat_festival
                nik: 3171xxxxxxxxxx33
              contact_email: buyer@example.com
      responses:
        '200':
          description: 'ALREADY_HELD — Sudah HELD atau lebih jauh: booking yang ada, tanpa hold kedua'
