                      message: Sesi booking sudah berakhir
                      error_code: GRANT_TOKEN_INVALID
                      server_time: '2026-11-03T09:12:00.412Z'
                    data: {}
        '503':
          description: INTERNAL_ERROR — INTERNAL_ERROR
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    type: object
                    properties:
                      code:
                        type: integer
                        example: 503
                      message:
                        type: string
                        example: Layanan sedang gangguan, coba lagi
                      error_code:
                        type: string
                        example: INTERNAL_ERROR
                        description: Kode mesin (Appendix A api-contracts). Hanya pada error
                      server_time:
                        type: string
                        format: date-time
                        example: '2026-11-03T09:12:00.412Z'
                        description: Jam server, ada di SETIAP respons (BR-10)
                    required:
                    - code
                    - message
                    - server_time
                    - error_code
                  data:
                    type: object
                    properties: {}
                required:
                - meta
                - data
              examples:
                INTERNAL_ERROR:
                  value:
                    meta:
                      code: 503
                      message: Layanan sedang gangguan, coba lagi
                      error_code: INTERNAL_ERROR
                      server_time: '2026-11-03T09:12:00.412Z'
                    data: {}
  /payments/webhook:
    post:
      tags:
      - Payment
      summary: Payment Gateway Webhook
      operationId: paymentWebhook
      description: |-
        Callback Midtrans Core API.

        TIDAK ADA HEADER TANDA TANGAN. Midtrans tidak mengirim X-Callback-Signature; tanda tangan ada DI DALAM BODY sebagai signature_key. v2.4 mendeklarasikan header itu dan itu salah dua kali — header tidak ada, dan contohnya SHA256 sementara rumusnya SHA512.

        VERIFIKASI: SHA512(order_id + status_code + gross_amount + ServerKey), konkatenasi polos tanpa pemisah. gross_amount adalah string desimal dan masuk hash APA ADANYA — menormalisasinya ("1500000.00" → "1500000") membuat setiap tanda tangan gagal.

        IDEMPOTENCY: gateway_event_id = order_id + ':' + transaction_status + ':' + status_code. Midtrans tidak mengirim event_id, dan transaction_id saja tidak cukup karena ia stabil lintas pending → settlement — memakainya akan membuang notifikasi settlement sebagai duplikat dari pending.

        Pemeriksaan kedua yang disarankan Midtrans (query status transaksi) sudah dijalankan charge reconciler.

        Requirement: FR-25, FR-22, FR-23, FR-26, NFR-07
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - order_id
              - transaction_status
              - signature_key
              - status_code
              - gross_amount
              properties:
                order_id:
                  type: string
                  description: RB-00912 — booking_id kami, dikirim sebagai order_id
                transaction_status:
                  type: string
                  description: capture | settlement | pending | deny | cancel | expire | refund
                fraud_status:
                  type: string
                  description: accept | challenge | deny. WAJIB diperiksa saat transaction_status=capture
                signature_key:
                  type: string
                  description: SHA512(order_id + status_code + gross_amount + ServerKey) — konkatenasi polos, TANPA pemisah
                status_code:
                  type: string
                  description: 200 | 201 | 202 | 407 — string, bukan integer; masuk hash apa adanya
                gross_amount:
                  type: string
                  description: Desimal sebagai STRING, mis. "1500000.00". Masuk signature apa adanya — jangan dinormalisasi
                transaction_id:
                  type: string
                  description: 'ID Midtrans. TIDAK dapat dipakai sendiri sebagai kunci idempotency: stabil lintas pending
                    → settlement'
                payment_type:
                  type: string
                  description: bank_transfer | gopay
                transaction_time:
                  type: string
                  description: WIB tanpa penanda zona, mis. "2026-11-03 09:12:00"
                status_message:
                  type: string
                  description: Teks penyedia; diteruskan ke reason pada GET /payments/{id}/status untuk support
                merchant_id:
                  type: string
                  description: ID merchant Midtrans
                currency:
                  type: string
                  description: IDR
            example:
              transaction_time: '2026-11-03 09:12:00'
              transaction_status: settlement
              transaction_id: 9aa6b8e1-7b1f-4f0e-8a2d-1c3e5f7a9b0d
              status_message: midtrans payment notification
              status_code: '200'
              signature_key: 4f0e8a2d1c3e5f7a9b0d...
              payment_type: bank_transfer
              order_id: RB-00912
              merchant_id: G123456789
              gross_amount: '1500000.00'
              fraud_status: accept
              currency: IDR
      responses:
        '200':
          description: Callback processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    type: object
                    properties:
                      code:
                        type: integer
                        example: 200
                      message:
                        type: string
                        example: Callback processed
                      server_time:
                        type: string
                        format: date-time
                        example: '2026-11-03T09:12:00.412Z'
                        description: Jam server, ada di SETIAP respons; klien menyinkronkan jamnya dari sini (BR-10)
                  data:
                    type: object
                    properties: {}
              examples:
                Success:
                  value:
                    meta:
                      code: 200
                      message: Callback processed
                      server_time: '2026-11-03T09:12:00.412Z'
                    data: {}
  /admin/reconciliation/disputed:
    get:
      tags:
      - Admin
      summary: Disputed Payment Reconciliation
      operationId: getDisputedPayments
      description: Disputed payments.
      parameters:
      - name: event_id
        in: query
        required: true
        schema:
          type: string
        example: evt_konser_a
      responses:
        '200':
          description: Disputed payments
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    type: object
                    properties:
                      code:
                        type: integer
                        example: 200
                      message:
                        type: string
                        example: Success
                      server_time:
                        type: string
                        format: date-time
                        example: '2026-11-03T09:12:00.412Z'
                        description: Jam server, ada di SETIAP respons; klien menyinkronkan jamnya dari sini (BR-10)
                  data:
                    type: object
                    properties:
                      disputed:
                        type: array
                        items:
                          type: object
                          properties:
                            booking_id:
                              type: string
                              example: RB-00912
                            order_id:
                              type: string
                              example: RB-00912:2
                            gateway_event_id:
                              type: string
                              example: evt_9f2a1c7b
                            gross_amount:
                              type: integer
                              example: 1500000
                            payment_type:
                              type: string
                              example: bank_transfer
                            paid_at:
                              type: string
                              example: '2026-10-26T10:25:48Z'
                            cancelled_at:
                              type: string
                              example: '2026-10-26T10:25:30Z'
                            contact_email:
                              type: string
                              example: buyer@example.com
                            refund_status:
                              type: string
                              example: PENDING_MANUAL
              examples:
                Success:
                  value:
                    meta:
                      code: 200
                      message: Success
                      server_time: '2026-11-03T09:12:00.412Z'
                    data:
                      disputed:
                      - booking_id: RB-00912
                        order_id: RB-00912:2
                        gateway_event_id: evt_9f2a1c7b
                        gross_amount: 1500000
                        payment_type: bank_transfer
                        paid_at: '2026-10-26T10:25:48Z'
                        cancelled_at: '2026-10-26T10:25:30Z'
                        contact_email: buyer@example.com
                        refund_status: PENDING_MANUAL
      security:
      - BearerAuth: []
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Access token JWT sesi akun (22740 detik), diterbitkan GET /auth/verify atau POST /auth/refresh. Satu-satunya
        kredensial yang menempati slot Authorization. TIDAK dikirim ke endpoint booking/payment sama sekali: sejak v2.4 bookings.account_id
        diambil dari keterlibatan pada INSERT saat GRANT, bukan dari kredensial klien saat checkout.'
    QueueTokenCookie:
      type: apiKey
      in: cookie
      name: queue_token
      description: 'TIDAK DIPAKAI sejak v2.28: server tidak lagi menyetel atau membaca cookie queue_token (cookie menimbulkan
        bug saat join antrian event lain). Pakai QueueTokenHeader.'
    GrantToken:
      type: apiKey
      in: header
      name: X-Grant-Token
      description: Grant slot opaque (gt_...), dari GET /events/{event_id}/queue/me setelah event grant. Membuktikan pemegangnya
        punya slot, bukan siapa dirinya — tamu mendapatkannya juga. Wajib pada seluruh endpoint booking dan payment. Tersimpan
        di Redis, jadi satu DEL mencabutnya.
    QueueTokenHeader:
      type: apiKey
      in: header
      name: X-Queue-Token
      description: 'Token ruang tunggu (queue_token dari body join) untuk web dan mobile, termasuk SSE stream (web: klien
        SSE berbasis fetch). Bukan Authorization: slot itu milik sesi akun. TTL token:{uuid} adalah batas atas: keadaan terminal
        menghapusnya lebih cepat, dan CONFIRMED menggantinya dengan nisan settled:{uuid}.'
    ETicketToken:
      type: apiKey
      in: query
      name: t
      description: HMAC bertanda tangan atas satu ticket_id + kedaluwarsa, dikirim pada tautan di email e-tiket. Tanpa identitas
        akun, lingkup satu tiket, berlaku sampai tanggal event + 1 hari. Ada karena FR-26 mengirim tiket ke masing-masing
        pemegang NIK, dan pemegang NIK umumnya tidak punya akun — rute yang hanya menerima sesi akun membuat tombol di email
        mereka menjawab 401.
