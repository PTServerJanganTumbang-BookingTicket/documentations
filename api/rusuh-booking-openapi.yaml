  /payments/{booking_id}:
    post:
      tags:
      - Payment
      summary: Initiate Payment
      operationId: initiatePayment
      description: |-
        Initiate payment.

        v2.20: Authorization: Bearer wajib bila grant milik akun login (401 UNAUTHORIZED / TOKEN_EXPIRED / TOKEN_INVALID).

        v2.25: di WebView pembayaran, X-Payment-Session menggantikan X-Grant-Token (+ X-Device-Id / Authorization). Lihat api-contracts §5 dan ADR-007.
      parameters:
      - name: booking_id
        in: path
        required: true
        schema:
          type: string
        example: RB-00912
      - name: X-Grant-Token
        in: header
        required: false
        description: Grant slot dari GET /queue/me. Wajib — ini yang menjaga endpoint ini. Wajib, KECUALI di WebView pembayaran
          yang mengirim X-Payment-Session sebagai gantinya (v2.25, ADR-007).
        schema:
          type: string
        example: gt_abc123
      - name: X-Device-Id
        in: header
        required: false
        description: Pengikatan device untuk grant anonim — WAJIB bila pemanggil tidak login. Acak 128 bit dari klien; server
          menyimpan HMAC-nya. Tidak cocok → 401 DEVICE_MISMATCH.
        schema:
          type: string
        example: d3f1a9c4b70e42f88a1c5e6072b9d4af
      - name: Authorization
        in: header
        required: false
        description: Bearer access token akun. WAJIB bila grant milik akun login (harus akun yang sama dengan grant); tamu
          tidak mengirimnya. Hilang/akun lain → 401 UNAUTHORIZED, kedaluwarsa → 401 TOKEN_EXPIRED, tidak sah → 401 TOKEN_INVALID
        schema:
          type: string
        example: Bearer eyJhbGciOi…
      - name: X-Payment-Session
        in: header
        required: false
        description: 'Hanya di WebView pembayaran (ADR-007): payment_session dari POST /payments/handoff/exchange, PENGGANTI
          X-Grant-Token + X-Device-Id + Authorization. Dikirim bersama X-Grant-Token → 400 VALIDATION_ERROR; X-Device-Id /
          Authorization yang ikut terkirim diabaikan. Tidak dikenal / grant sudah dihapus → 401 PAYMENT_SESSION_INVALID; booking
          lain → 404 NOT_FOUND.'
        schema:
          type: string
        example: ps_bTN4V1pLc0c2cWJ2Tk5yUjhYa0ZqZEw3a1R1aEVwWg
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - method
              properties:
                method:
                  type: string
                  enum:
                  - bank_transfer
                  - gopay
                bank:
                  type: string
                  enum:
                  - bca
                  - bni
                  - bri
                  - cimb
            examples:
              example1:
                value:
                  method: bank_transfer
                  bank: bca
              example2:
                value:
                  method: gopay
      responses:
        '200':
          description: Payment initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    type: object
                    properties:
                      code:
                        type: integer
                        example: 200
                      message:
                        type: string
                        example: Payment initiated
                      server_time:
                        type: string
                        format: date-time
                        example: '2026-11-03T09:12:00.412Z'
                        description: Jam server, ada di SETIAP respons; klien menyinkronkan jamnya dari sini (BR-10)
                  data:
                    type: object
                    properties:
                      payment_id:
                        type: string
                        example: RB-00912:1
                      method:
                        type: string
                        example: bank_transfer
                      status:
                        type: string
                        example: PENDING
                      instructions:
                        type: object
                        properties:
                          bank:
                            type: string
                            example: bca
                          va_number:
                            type: string
                            example: '8801234567890'
                      ttl:
                        type: object
                        properties:
                          expires_at:
                            type: string
                            example: '2026-10-25T10:25:00Z'
                          server_time:
                            type: string
                            example: '2026-10-25T10:16:00Z'
              examples:
                VA BCA:
                  value:
                    meta:
                      code: 200
                      message: Payment initiated
                      server_time: '2026-11-03T09:12:00.412Z'
                    data:
                      payment_id: RB-00912:1
                      method: bank_transfer
                      status: PENDING
                      instructions:
                        bank: bca
                        va_number: '8801234567890'
                      ttl:
                        expires_at: '2026-10-25T10:25:00Z'
                        server_time: '2026-10-25T10:16:00Z'
                GoPay:
                  value:
                    meta:
                      code: 200
                      message: Payment initiated
                      server_time: '2026-11-03T09:12:00.412Z'
                    data:
                      payment_id: RB-00912:1
                      method: gopay
                      status: PENDING
                      instructions:
                        qr_url: https://api.midtrans.com/v2/gopay/.../qr-code
                        deeplink_url: https://gojek.link/...
                      ttl:
                        expires_at: '2026-10-25T10:25:00Z'
                        server_time: '2026-10-25T10:16:00Z'
