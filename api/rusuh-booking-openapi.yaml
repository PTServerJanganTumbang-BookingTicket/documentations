                  value:
                    meta:
                      code: 403
                      message: Verifikasi CAPTCHA gagal, ambil token baru
                      error_code: CAPTCHA_FAILED
                      server_time: '2026-11-03T09:12:00.412Z'
                    data: {}
        '404':
          description: NOT_FOUND — event_id tidak dapat menjadi hash tag Redis ({, } atau spasi)
          content:
            application/json:
              schema:
                type: object
                properties:
