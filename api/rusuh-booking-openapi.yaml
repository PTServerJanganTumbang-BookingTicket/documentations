  /events/{event_id}/queue/join:
    post:
      tags:
      - Queue
      summary: Join Queue
      operationId: joinQueue
      description: |-
        Join queue. Dipanggil oleh tombol event bila display.enabled (§2.1).

        URUTAN PEMERIKSAAN: bentuk request → identitas (Bearer tidak sah = 401, bukan tamu; tamu wajib X-Device-Id) → rate limit → CAPTCHA → state sale → pemulihan (BR-09 queue_token milik pemanggil, lalu BR-07 akun) → kapasitas → nomor baru. Rate limit DULU, CAPTCHA kemudian: rate limit adalah panggilan Redis lokal; verifikasi CAPTCHA adalah round trip eksternal. Penolakan apa pun tidak memakan ticket_no.

        TANPA COOKIE (v2.28): join tidak mengirim Set-Cookie dan tidak membaca cookie queue_token. Web dan mobile menyimpan data.queue_token per event dan mengirimnya sebagai X-Queue-Token.

        Respons membawa queue_token (untuk mobile, v2.7) dan sse_url absolut (host events.*, v2.8). Tidak ada estimasi waktu tunggu: frontend menghitungnya dari ratePerMin (api-contracts §3.5).

        queue_token hanya berlaku bagi pemiliknya (v2.9, ADR-006 §8.9): token tamu dari perangkat lain → 401 DEVICE_MISMATCH; token akun dipakai akun lain / tamu → 401 UNAUTHORIZED. Klien menghapus token antriannya lalu join lagi tanpa token.

        TANPA LANGSUNG-MASUK (v2.12, ADR-006 §8.14): join tidak menunggu grant dan tidak pernah menjawab granted. Bila tempat masih kosong, tick admission-ctl berikutnya (≤ 500 ms) memasukkan customer; klien tahu lewat stream dan GET /queue/me. Join tidak pernah memberi grant sendiri.

        FULL_BOOKED TIDAK menolak join (v2.22, ADR-006 §8.18): customer baru tetap mendapat nomor dan menunggu kursi yang kembali. data.queue_state pada error memakai nama §2.1: SCHEDULED (SALE_NOT_OPEN), FULL_QUEUE (QUEUE_FULL).

        TEMPAT YANG SUDAH BERAKHIR (v2.29, ADR-006 §8.21): bila booking dari queue_token / akun pemanggil sudah LAPSED, EXPIRED, ABANDONED atau CONFIRMED, join memberi tempat baru di belakang (ticket_no dan queue_token baru, tanpa rejoined) dan memindah acct ke token baru. Klien mengganti queue_token event itu.
      parameters:
      - name: event_id
        in: path
        required: true
        schema:
          type: string
        example: evt_konser_a
      - name: X-Device-Id
        in: header
        required: false
        description: Acak 128 bit dari klien, disimpan server sebagai HMAC pada keterlibatan dan dicocokkan pada setiap panggilan
          ber-grant. WAJIB bila tidak login — grant tanpa pengikatan tidak dapat diikat belakangan, jadi tamu yang tidak mengirimnya
          ditolak DI SINI dengan 400 DEVICE_ID_REQUIRED, bukan nanti. Format tidak divalidasi (v2.9).
        schema:
          type: string
        example: d3f1a9c4b70e42f88a1c5e6072b9d4af
      - name: Authorization
        in: header
        required: false
        description: 'Bearer {access_token} bila login. Satu-satunya tempat di jalur antrian yang menerimanya: BR-07 lewat
          acct:{ev}:{account_id}, dan account_id pada keterlibatan — yang menjadi bookings.account_id pada INSERT saat GRANT.'
        schema:
          type: string
      - name: X-Queue-Token
        in: header
        required: false
        description: 'Token ruang tunggu event ini (web dan mobile), opsional: rejoin BR-09. v2.28: satu-satunya pembawa token,
          cookie tidak dibaca.'
        schema:
          type: string
        example: qt_xyz789
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - captcha_token
              properties:
                captcha_token:
                  type: string
                  description: 'Token CAPTCHA TAK TERLIHAT, diambil klien SEBELUM gerbang buka dan disegarkan tiap ~60 detik.
                    ticket_no berasal dari INCR issued saat join: bila klien harus menyelesaikan tantangan lebih dulu, manusia
                    yang butuh tiga detik mendapat nomor LEBIH BESAR daripada bot yang menembus layanan pemecah dalam 200
                    ms. Mode interaktif TIDAK BOLEH dipakai di endpoint ini. Berlaku untuk tamu DAN user login — mengecualikan
                    login menjadikannya jalur ramah bot (akun hanya 5/IP/jam).'
            example:
              captcha_token: 0.AbCdEf...
      responses:
        '200':
          description: Joined queue
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    type: object
                    properties:
                      code:
                        type: integer
                        example: 200
                      message:
                        type: string
                        example: Successfully joined queue
                      server_time:
                        type: string
                        format: date-time
                        example: '2026-11-03T09:12:00.412Z'
                        description: Jam server, ada di SETIAP respons (BR-10)
                    required:
                    - code
                    - message
                    - server_time
                  data:
                    type: object
                    properties:
                      ticket_no:
                        type: integer
                        example: 32748
                      now_serving:
                        type: integer
                        example: 31500
                      position:
                        type: integer
                        example: 1248
                        description: ticket_no − now_serving. Estimasi menit dihitung frontend dari ratePerMin (api-contracts
                          §3.5)
                      queue_token:
                        type: string
                        example: qt_xyz789
                        description: 'Web dan mobile: simpan per event_id (mobile: secure store, web: sessionStorage), kirim
                          sebagai X-Queue-Token ke join, stream dan /queue/me. v2.28: tidak ada cookie'
                      sse_url:
                        type: string
                        example: https://events.my-rusuh.my.id/events/evt_konser_a/queue/stream
                        description: URL absolut stream §3.2 (host events.*, beda dari join di api.*)
                      event:
                        type: object
                        properties:
                          id:
                            type: string
                            example: evt_konser_a
                          name:
                            type: string
                            example: Konser A — Jakarta
                      rejoined:
                        type: boolean
                        description: 'true bila keterlibatan yang masih hidup dipulihkan (BR-07 / BR-09). v2.29: tempat yang
                          booking-nya sudah LAPSED, EXPIRED, ABANDONED atau CONFIRMED tidak dipulihkan; join memberi ticket_no
                          dan queue_token baru (field ini tidak ada)'
                      state:
                        type: string
                        example: QUEUED
                        description: 'Hanya pada rejoined: keadaan engagement (§3.3): QUEUED, GRANTED, SELECTING, HELD, AWAITING_PAYMENT,
                          PENDING_CANCELLATION; bila bukan QUEUED rutekan sesuai state. Tidak pernah LAPSED/EXPIRED/ABANDONED/CONFIRMED
                          (v2.29)'
                required:
                - meta
                - data
              examples:
                New queue position:
                  value:
                    meta:
                      code: 200
                      message: Successfully joined queue
                      server_time: '2026-11-03T09:12:00.412Z'
                    data:
                      ticket_no: 32748
                      now_serving: 31500
                      position: 1248
                      queue_token: qt_xyz789
                      sse_url: https://events.my-rusuh.my.id/events/evt_konser_a/queue/stream
                      event:
                        id: evt_konser_a
                        name: Konser A — Jakarta
                Rejoined (BR-07 / BR-09):
                  value:
                    meta:
                      code: 200
                      message: Rejoined existing queue position
                      server_time: '2026-11-03T09:12:00.412Z'
                    data:
                      ticket_no: 32748
                      now_serving: 31520
                      position: 1228
                      queue_token: qt_xyz789
                      sse_url: https://events.my-rusuh.my.id/events/evt_konser_a/queue/stream
                      rejoined: true
                      state: QUEUED
        '400':
          description: CAPTCHA_REQUIRED — captcha_token tidak disertakan (CAPTCHA_REQUIRED), X-Device-Id tidak ada untuk tamu
            (DEVICE_ID_REQUIRED), atau body / X-Device-Id tidak valid (VALIDATION_ERROR)
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    type: object
                    properties:
                      code:
                        type: integer
                        example: 400
                      message:
                        type: string
                        example: Verifikasi CAPTCHA diperlukan
                      error_code:
                        type: string
                        example: CAPTCHA_REQUIRED
                        description: Kode mesin (Appendix A api-contracts). Hanya pada error
                      server_time:
                        type: string
                        format: date-time
                        example: '2026-11-03T09:12:00.412Z'
                        description: Jam server, ada di SETIAP respons (BR-10)
                    required:
                    - code
                    - message
                    - server_time
                    - error_code
                  data:
                    type: object
                    properties: {}
                required:
                - meta
                - data
              examples:
                CAPTCHA_REQUIRED:
                  value:
                    meta:
                      code: 400
                      message: Verifikasi CAPTCHA diperlukan
                      error_code: CAPTCHA_REQUIRED
                      server_time: '2026-11-03T09:12:00.412Z'
                    data: {}
                DEVICE_ID_REQUIRED:
                  value:
                    meta:
                      code: 400
                      message: X-Device-Id wajib untuk pembeli tamu
                      error_code: DEVICE_ID_REQUIRED
                      server_time: '2026-11-03T09:12:00.412Z'
                    data: {}
                VALIDATION_ERROR:
                  value:
                    meta:
                      code: 400
                      message: Body tidak valid
                      error_code: VALIDATION_ERROR
                      server_time: '2026-11-03T09:12:00.412Z'
                    data: {}
        '401':
          description: TOKEN_INVALID / TOKEN_EXPIRED / DEVICE_MISMATCH / UNAUTHORIZED — Authorization dikirim tetapi tidak
            sah (termasuk Bearer kosong). Tidak diperlakukan sebagai tamu.
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    type: object
                    properties:
                      code:
                        type: integer
                        example: 401
                      message:
                        type: string
                        example: Sesi tidak valid
                      error_code:
                        type: string
                        example: TOKEN_INVALID
                        description: Kode mesin (Appendix A api-contracts). Hanya pada error
                      server_time:
                        type: string
                        format: date-time
                        example: '2026-11-03T09:12:00.412Z'
                        description: Jam server, ada di SETIAP respons (BR-10)
                    required:
                    - code
                    - message
                    - server_time
                    - error_code
                  data:
                    type: object
                    properties: {}
                required:
                - meta
                - data
              examples:
                TOKEN_INVALID:
                  value:
                    meta:
                      code: 401
                      message: Sesi tidak valid
                      error_code: TOKEN_INVALID
                      server_time: '2026-11-03T09:12:00.412Z'
                    data: {}
                TOKEN_EXPIRED:
                  value:
                    meta:
                      code: 401
                      message: Sesi sudah kedaluwarsa
                      error_code: TOKEN_EXPIRED
                      server_time: '2026-11-03T09:12:00.412Z'
