                        description: SELECTING (GRANTED, SELECTING) · PENDING_PAYMENT (HELD, AWAITING_PAYMENT, PENDING_CANCELLATION)
                          · PAID (CONFIRMED) · EXPIRED (EXPIRED, LAPSED, ABANDONED)
                      event:
