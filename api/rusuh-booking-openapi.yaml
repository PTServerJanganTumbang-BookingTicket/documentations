                        description: Jam server, ada di SETIAP respons; klien menyinkronkan jamnya dari sini (BR-10)
                  data:
                    type: object
                    properties:
                      access_token:
                        type: string
                        description: JWT HS256, berlaku expires_in detik
                        example: eyJhbG...
                      refresh_token:
                        type: string
                        description: Pengganti yang baru — token yang dikirim sudah hangus
                        example: wB3nT8kM2pQ7vF1xJ9cL5gH4dZ6yA0sR
