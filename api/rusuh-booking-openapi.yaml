                    image_url: https://cdn.rusuh.id/events/konser-a.jpg
                  session:
                    expires_at: "2026-10-23T13:15:00Z"
                    ttl_seconds: 287
                    server_time: "2026-10-23T13:10:13Z"
                  categories:
                    - id: cat_vip
                      name: VIP
