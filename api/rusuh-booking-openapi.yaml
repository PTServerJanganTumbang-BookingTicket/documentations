  /events/{event_id}/queue/stream:
    get:
      tags:
      - Queue
      summary: Queue Status Stream (SSE)
      operationId: queueStream
      description: |-
        SSE stream (ALB events.my-rusuh.my.id). Auth: X-Queue-Token (web lewat klien SSE berbasis fetch, mobile). v2.28: tidak ada cookie queue_token.

        Semua koneksi event menerima byte yang identik. Frontend menghitung position = ticket_no − nowServing dan estimasi menit dari ratePerMin (api-contracts §3.5). nowServing ≥ ticket_no → GET /queue/me.

        | Event | Kapan | data |
        |---|---|---|
        | (default) | snapshot saat connect, tiap nowServing berubah, heartbeat 10 detik | {nowServing, state, ratePerMin, serverTime} + id |
        | status | tiap transisi state: OPEN → FULL_BOOKED, FULL_BOOKED → OPEN, → CLOSED | {state, fullBookedAt, serverTime} |
        | stale | data berhenti segar (Redis putus / tanpa broadcast 30 detik), dan saat pulih | {stale, state, message?, serverTime} |
        | sold-out | tepat setelah status CLOSED | {state: CLOSED, message, serverTime} — klien WAJIB es.close() |
        | reconnect | task shutdown | retry: berjitter 1–15 detik; data {state, message, serverTime} |
        | : keepalive | tiap 15 detik | komentar SSE |

        FULL_BOOKED reversibel: klien tetap tersambung. Hanya CLOSED yang menutup stream (410 untuk koneksi baru).

        Setiap event bernama membawa `state` dan `serverTime`. `message` adalah teks siap tampil (stale true, sold-out, reconnect); jangan dijadikan kondisi percabangan, gunakan `stale`, `state` dan nama event.
      parameters:
      - name: event_id
        in: path
        required: true
        schema:
          type: string
        example: evt_konser_a
      - name: X-Queue-Token
        in: header
        required: false
        description: 'Token ruang tunggu (web dan mobile). Web memakai klien SSE berbasis fetch karena EventSource tidak dapat
          menyetel header; v2.28: tidak ada cookie.'
        schema:
          type: string
        example: qt_xyz789
      responses:
        '200':
          description: SSE stream — skema per frame di itemSchema
          content:
            text/event-stream:
              schema:
                type: object
                description: Satu frame SSE. `data` berisi JSON sesuai `event`.
                properties:
                  event:
                    type: string
                    enum:
                    - message
                    - status
                    - stale
                    - sold-out
                    - reconnect
                    description: Nama event; kosong = message (default)
                  id:
                    type: string
                    description: = nowServing, hanya pada event default
                  retry:
                    type: integer
                    description: ms, hanya pada reconnect
                  data:
                    oneOf:
                    - title: QueueStreamUpdate (default event)
                      type: object
                      properties:
                        nowServing:
                          type: integer
                          example: 31604
                        state:
                          type: string
                          enum:
                          - SCHEDULED
                          - OPEN
                          - FULL_BOOKED
                          - CLOSED
                          example: OPEN
                        ratePerMin:
                          type: integer
                          example: 318
                          description: Nomor yang dilewati nowServing per menit (60 detik terakhir selama OPEN)
                        serverTime:
                          type: string
                          format: date-time
                          example: '2026-10-24T13:10:01.004Z'
                      required:
                      - nowServing
                      - state
                      - ratePerMin
                      - serverTime
                      additionalProperties: false
                    - title: 'QueueStreamStatus (event: status)'
                      type: object
                      properties:
                        state:
                          type: string
                          enum:
                          - SCHEDULED
                          - OPEN
                          - FULL_BOOKED
                          - CLOSED
                          example: FULL_BOOKED
                        fullBookedAt:
                          type:
                          - string
                          - 'null'
                          format: date-time
                          description: Hanya pada FULL_BOOKED
                        serverTime:
                          type: string
                          format: date-time
                      required:
                      - state
                      - serverTime
                      additionalProperties: false
                    - title: 'QueueStreamStale (event: stale)'
                      type: object
                      properties:
                        stale:
                          type: boolean
                          example: true
                        state:
                          type: string
                          enum:
                          - SCHEDULED
                          - OPEN
                          - FULL_BOOKED
                          - CLOSED
                          example: OPEN
                          description: Keadaan sale saat pesan dikirim
                        message:
                          type: string
                          example: Data antrian belum diperbarui
                          description: Teks untuk pelanggan; ada saat stale true, tidak ada saat pulih
                        serverTime:
                          type: string
                          format: date-time
                          example: '2026-10-24T13:10:01.004Z'
                      required:
                      - stale
                      - state
                      - serverTime
                      additionalProperties: false
                    - title: 'QueueStreamSoldOut (event: sold-out)'
                      type: object
                      properties:
                        state:
                          type: string
                          enum:
                          - CLOSED
                          example: CLOSED
                          description: Keadaan sale saat pesan dikirim
                        message:
                          type: string
                          example: Tiket sudah habis
                        serverTime:
                          type: string
                          format: date-time
                          example: '2026-10-24T13:10:01.004Z'
                      required:
                      - state
                      - message
                      - serverTime
                      additionalProperties: false
                    - title: 'QueueStreamReconnect (event: reconnect)'
                      type: object
                      properties:
                        state:
                          type: string
                          enum:
                          - SCHEDULED
                          - OPEN
                          - FULL_BOOKED
                          example: OPEN
                          description: 'Keadaan sale saat pesan dikirim (tidak pernah CLOSED: stream yang ditutup memakai
                            sold-out)'
                        message:
                          type: string
                          example: Server sedang diperbarui, menyambung ulang otomatis
                        serverTime:
                          type: string
                          format: date-time
                          example: '2026-10-24T13:10:01.004Z'
                      required:
                      - state
                      - message
                      - serverTime
                      additionalProperties: false
                required:
                - data
              examples:
                Snapshot:
                  value: |
                    id: 31600
                    data: {"nowServing":31600,"state":"OPEN","ratePerMin":318,"serverTime":"2026-10-24T13:10:00.412Z"}
                Update posisi:
                  value: |
                    id: 31604
                    data: {"nowServing":31604,"state":"OPEN","ratePerMin":318,"serverTime":"2026-10-24T13:10:01.004Z"}
                Status FULL_BOOKED (tetap tersambung):
                  value: |
                    event: status
                    data: {"state":"FULL_BOOKED","fullBookedAt":"2026-10-24T13:40:12.000Z","serverTime":"2026-10-24T13:40:12.120Z"}
                Status OPEN (stok kembali):
                  value: |
                    event: status
                    data: {"state":"OPEN","fullBookedAt":null,"serverTime":"2026-10-24T13:44:02.501Z"}
                Closed — es.close():
                  value: |
                    event: status
                    data: {"state":"CLOSED","fullBookedAt":null,"serverTime":"2026-10-24T13:55:42.000Z"}

                    event: sold-out
                    data: {"state":"CLOSED","message":"Tiket sudah habis","serverTime":"2026-10-24T13:55:42.000Z"}
                Stale:
                  value: |
                    event: stale
                    data: {"stale":true,"state":"OPEN","message":"Data antrian belum diperbarui","serverTime":"2026-10-24T13:10:31.000Z"}
                Keepalive:
                  value: |
                    : keepalive
                Reconnect (server shutting down):
                  value: |+
                    event: reconnect
                    retry: 7300
                    data: {"state":"OPEN","message":"Server sedang diperbarui, menyambung ulang otomatis","serverTime":"2026-10-24T13:10:00.000Z"}

