  /nik/validate:
    post:
      tags:
      - NIK
      summary: Validate NIK
      operationId: validateNik
      description: |-
        Validate NIK.

        v2.20: Authorization: Bearer wajib bila grant milik akun login (401 UNAUTHORIZED / TOKEN_EXPIRED / TOKEN_INVALID).

        v2.21: nik tidak lagi dibatasi 16 karakter di skema; server menormalisasi (hanya angka) lalu mewajibkan 16 digit.

        v2.21: field name dihapus dari respons (FR-15a: nama tidak pernah dikembalikan).
      parameters:
      - name: X-Grant-Token
        in: header
        required: true
        description: Grant slot dari GET /queue/me. Wajib — ini yang menjaga endpoint ini.
        schema:
          type: string
        example: gt_abc123
      - name: X-Device-Id
        in: header
        required: false
        description: Pengikatan device untuk grant anonim — WAJIB bila pemanggil tidak login. Acak 128 bit dari klien; server
          menyimpan HMAC-nya. Tidak cocok → 401 DEVICE_MISMATCH.
        schema:
          type: string
        example: d3f1a9c4b70e42f88a1c5e6072b9d4af
      - name: Authorization
        in: header
        required: false
        description: Bearer access token akun. WAJIB bila grant milik akun login (harus akun yang sama dengan grant); tamu
          tidak mengirimnya. Hilang/akun lain → 401 UNAUTHORIZED, kedaluwarsa → 401 TOKEN_EXPIRED, tidak sah → 401 TOKEN_INVALID
        schema:
          type: string
        example: Bearer eyJhbGciOi…
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - nik
              properties:
                nik:
                  type: string
                  description: 'NIK, dinormalisasi seperti POST /nik/validate: semua karakter selain angka dibuang (spasi,
                    titik, tanda hubung), lalu wajib tepat 16 digit; selain itu 400 VALIDATION_ERROR ("NIK must be exactly
                    16 digits")'
                  example: 3171 0000 0000 0022
            example:
              nik: 3171xxxxxxxxxx22
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    type: object
                    properties:
                      code:
                        type: integer
                        example: 200
                      message:
                        type: string
                        example: NIK is valid
                      server_time:
                        type: string
                        format: date-time
                        example: '2026-11-03T09:12:00.412Z'
                        description: Jam server, ada di SETIAP respons; klien menyinkronkan jamnya dari sini (BR-10)
                  data:
                    type: object
                    properties:
                      nik:
                        type: string
                        example: 3171xxxxxxxxxx22
                      valid:
                        type: boolean
                        example: true
                      status:
                        type: string
                        example: ACTIVE
                      source:
                        type: string
                        example: verified
              examples:
                NIK valid:
                  value:
                    meta:
                      code: 200
                      message: NIK is valid
                      server_time: '2026-11-03T09:12:00.412Z'
                    data:
                      nik: 3171xxxxxxxxxx22
                      valid: true
                      status: ACTIVE
                      source: verified
                NIK not found:
                  value:
                    meta:
                      code: 200
                      message: NIK not found
                      server_time: '2026-11-03T09:12:00.412Z'
                    data:
                      nik: '0000000000000000'
                      valid: false
                      reason: NIK_NOT_FOUND
        '400':
          description: VALIDATION_ERROR — Invalid NIK format
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    type: object
                    properties:
                      code:
                        type: integer
                        example: 400
                      message:
                        type: string
                        example: NIK must be exactly 16 digits
                      error_code:
                        type: string
                        example: VALIDATION_ERROR
                        description: Kode mesin (Appendix A api-contracts). Hanya pada error
                      server_time:
                        type: string
                        format: date-time
                        example: '2026-11-03T09:12:00.412Z'
                        description: Jam server, ada di SETIAP respons (BR-10)
                    required:
                    - code
                    - message
                    - server_time
                    - error_code
                  data:
                    type: object
                    properties: {}
                required:
                - meta
                - data
              examples:
                VALIDATION_ERROR:
                  value:
                    meta:
                      code: 400
                      message: NIK must be exactly 16 digits
                      error_code: VALIDATION_ERROR
                      server_time: '2026-11-03T09:12:00.412Z'
                    data: {}
        '401':
          description: |-
            - UNAUTHORIZED — Unauthorized
            - TOKEN_EXPIRED — Unauthorized
            - TOKEN_INVALID — Unauthorized
          content:
            application/json:
              schema:
                oneOf:
