        "401":
          description: Access token invalid atau expired

  # ──────────────────────────────────────────────
  #  NIK VALIDATION
  # ──────────────────────────────────────────────

  /nik/validate:
    post:
      tags: [NIK]
      summary: Validate NIK
      operationId: validateNik
      description: |
        Validasi NIK ke Dukcapil sebelum submit booking.
        Dipanggil saat input NIK blur atau sebelum menekan "Lanjut ke Pembayaran".

        **Optimasi**: NIK Terdaftar (milik akun) atau NIK Tersimpan tidak memanggil Dukcapil — dijawab dari bukti verifikasi tersimpan. Response menyertakan `source: "registered" | "saved" | "verified"`.

        **Fail closed**: Dukcapil tidak tersedia → `DUKCAPIL_UNAVAILABLE` → pembayaran diblokir, bukan fallback.

        `already_used` bersifat indikatif saja — penegak sebenarnya adalah `SET nik:used NX` pada `POST /bookings`.
        **Requirement**: FR-15a
      parameters:
        - name: X-Device-Id
          in: header
          required: false
          description: >
            Pengikatan device untuk grant anonim — WAJIB bila pemanggil tidak login (OpenAPI
            tidak dapat menyatakan kewajiban bersyarat). Tidak cocok → 401 DEVICE_MISMATCH.
          schema:
            type: string
      security:
        - GrantToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nik]
              properties:
                nik:
                  type: string
                  minLength: 16
                  maxLength: 16
                  description: NIK 16 digit. Hanya NIK yang dikirim ke Dukcapil — tanpa nama atau tanggal lahir.
            example:
              nik: "3171xxxxxxxxxx22"
      responses:
        "200":
          description: Validation result — selalu 200 untuk valid maupun invalid
          content:
            application/json:
              examples:
                valid:
                  summary: NIK valid
                  value:
                    meta:
                      code: 200
                      message: NIK is valid
                    data:
                      nik: "3171xxxxxxxxxx22"
                      valid: true
                      name: JOHN DOE
                      status: ACTIVE
                      source: verified
                not_found:
                  summary: NIK tidak ditemukan di Dukcapil
                  value:
                    meta:
                      code: 200
                      message: NIK not found
                    data:
                      nik: "0000000000000000"
                      valid: false
                      reason: NIK_NOT_FOUND
                inactive:
                  summary: NIK tidak aktif
                  value:
                    meta:
                      code: 200
                      message: NIK is not valid
                    data:
                      valid: false
                      reason: NIK_INACTIVE
                already_used:
                  summary: NIK sudah dipakai untuk event ini (indikatif)
                  value:
                    meta:
                      code: 200
                      message: NIK already used for this event
                    data:
                      valid: true
                      already_used: true
                      reason: NIK_ALREADY_USED
                dukcapil_down:
                  summary: Dukcapil tidak tersedia — pembayaran diblokir
                  value:
                    meta:
                      code: 200
                      message: NIK validation service unavailable
                    data:
                      valid: false
                      reason: DUKCAPIL_UNAVAILABLE
        "400":
          description: Format NIK tidak valid
          content:
            application/json:
              example:
                meta:
                  code: 400
                  message: NIK must be exactly 16 digits
                data: {}
        "429":
          description: Rate limited
          content:
            application/json:
              example:
                meta:
                  code: 429
                  message: Please wait before validating another NIK
                data:
                  retry_after: 5

  # ──────────────────────────────────────────────
  #  BOOKING
  # ──────────────────────────────────────────────

  /bookings:
    post:
      tags: [Booking]
      summary: Create Booking
      operationId: createBooking
      description: |
        Submit pemilihan tiket. UI: tombol "Lanjut ke Pembayaran".

        **Memulai TTL pembayaran**: `payment_expires_at = held_at + 10 menit`. Setiap customer mendapat 10 menit penuh.

        **Hold all-or-nothing**: stok seluruh kategori diperiksa sebelum satu pun dikurangi, dalam satu skrip Lua atomik.

        **Multi-kategori diizinkan**: misalnya 1 VIP + 1 Festival + 1 Tribune. Batas 3 tiket per transaksi secara total, bukan per kategori.

        **1 NIK = 1 kursi** (BR-02): `holder_email` adalah alamat tujuan e-tiket kursi itu (FR-26).

        **Idempoten**: submit ulang mengembalikan booking yang ada — tidak ada hold kedua.
        **Requirement**: FR-13, FR-14, FR-15, FR-16, NFR-04, BR-01, BR-02
      parameters:
        - name: X-Device-Id
          in: header
          required: false
          description: >
            Pengikatan device untuk grant anonim — WAJIB bila pemanggil tidak login (OpenAPI
            tidak dapat menyatakan kewajiban bersyarat). Tidak cocok → 401 DEVICE_MISMATCH.
          schema:
            type: string
      security:
        - GrantToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event_id, tickets, contact_email, terms_version]
              properties:
                event_id:
                  type: string
                tickets:
                  type: array
                  minItems: 1
                  maxItems: 3
                  items:
                    type: object
                    required: [category_id, nik, holder_email]
                    properties:
                      category_id:
                        type: string
                      nik:
                        type: string
                        minLength: 16
                        maxLength: 16
                      holder_email:
                        type: string
                        format: email
                        description: Alamat tujuan e-tiket untuk pemegang NIK ini
                contact_email:
                  type: string
                  format: email
                  description: Email kontak pembeli utama
                terms_version:
                  type: string
                  description: Versi T&C yang ditampilkan dan disetujui
            example:
              event_id: evt_konser_a
              tickets:
                - category_id: cat_vip
                  nik: "3171xxxxxxxxxx22"
                  holder_email: buyer@example.com
                - category_id: cat_festival
                  nik: "3171xxxxxxxxxx33"
                  holder_email: friend@example.com
              contact_email: buyer@example.com
              terms_version: "2026-10-01"
      responses:
        "201":
          description: Booking created, stock held, payment TTL started
          content:
            application/json:
              example:
                meta:
                  code: 201
                  message: Booking created successfully
                data:
                  booking_id: RB-00912
                  status: PENDING_PAYMENT
                  event:
                    id: evt_konser_a
                    name: Konser A — Jakarta
                    date: "2026-12-25"
                    venue: GBK, Jakarta
                  tickets:
                    - category: VIP
                      price: 1500000
                      nik_masked: "3171********xx22"
                      holder_name: JOHN DOE
                    - category: Festival
                      price: 850000
                      nik_masked: "3171********xx33"
                      holder_name: JANE DOE
                  summary:
                    subtotal: 2350000
                    service_fee: 0
                    total: 2350000
                  payment_ttl:
                    expires_at: "2026-10-23T13:25:00Z"
                    ttl_seconds: 600
                    server_time: "2026-10-23T13:15:00Z"
                  redirect_url: /bookings/RB-00912/payment
        "400":
          description: Validation error
          content:
            application/json:
              examples:
                max_tickets:
                  summary: Melebihi batas 3 tiket
                  value:
                    meta:
                      code: 400
                      message: Maximum 3 tickets per order
                    data: {}
                nik_invalid:
                  summary: NIK tidak valid di Dukcapil
                  value:
                    meta:
                      code: 400
                      message: NIK 3171********xx22 tidak terdaftar di Dukcapil
                    data: {}
        "409":
          description: NIK sudah dipakai atau stok tidak cukup
          content:
            application/json:
              examples:
                nik_taken:
                  summary: NIK sudah digunakan untuk event ini
                  value:
                    meta:
                      code: 409
                      message: NIK 3171xxxxxxxxxx22 sudah digunakan untuk event ini
                    data: {}
                no_stock:
                  summary: Stok tidak mencukupi
                  value:
                    meta:
                      code: 409
                      message: Stok VIP tidak mencukupi
                    data:
                      available: 1
                      requested: 2

  /bookings/{booking_id}:
    get:
      tags: [Booking]
