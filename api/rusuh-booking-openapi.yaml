                  value:
                    meta:
                      code: 401
                      message: Queue token tidak valid atau tidak ada
                      error_code: UNAUTHORIZED
                      server_time: '2026-11-03T09:12:00.412Z'
                    data: {}
  /events/{event_id}/queue/serving:
    get:
      tags:
      - Queue
      summary: Get Now Serving (Polling Fallback)
      operationId: getNowServing
      description: |-
        Polling fallback.

        Mode polling: frontend menghitung posisi dan estimasi dari now_serving + rate_per_min (api-contracts §3.5), dan membaca state untuk FULL_BOOKED / CLOSED.
      parameters:
      - name: event_id
        in: path
        required: true
        schema:
          type: string
        example: evt_konser_a
      responses:
        '200':
          description: Now serving
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    type: object
                    properties:
                      code:
                        type: integer
                        example: 200
                      message:
                        type: string
                        example: Success
                      server_time:
                        type: string
                        format: date-time
                        example: '2026-11-03T09:12:00.412Z'
                        description: Jam server, ada di SETIAP respons (BR-10)
                    required:
                    - code
                    - message
                    - server_time
                  data:
                    type: object
                    properties:
                      now_serving:
                        type: integer
                        example: 31600
                      rate_per_min:
                        type: integer
                        example: 318
                        description: Nomor yang dilewati now_serving per menit. Frontend menghitung estimasi (api-contracts
                          §3.5)
                      server_time:
                        type: string
                        example: '2026-10-24T13:10:00.412Z'
                      poll_after_ms:
                        type: integer
                        example: 1000
                        description: Default bila posisi tidak diketahui. Pilih baris poll_tiers untuk posisi sendiri (ADR-006
                          §8.5)
                      poll_tiers:
                        type: array
                        description: Tabel interval milik server; klien memilih baris pertama dengan max_position >= posisinya
                          (null = tak terbatas)
                        items:
                          type: object
                          properties:
                            max_position:
                              type: integer
                              nullable: true
                              example: 10
                            poll_after_ms:
                              type: integer
                              example: 1000
                      state:
                        type: string
                        example: OPEN
                        enum:
                        - SCHEDULED
                        - OPEN
                        - FULL_BOOKED
                        - CLOSED
                    required:
                    - now_serving
                    - rate_per_min
                    - state
                    - server_time
                    - poll_after_ms
                    - poll_tiers
                required:
                - meta
                - data
              examples:
                Success:
                  value:
                    meta:
                      code: 200
                      message: Success
                      server_time: '2026-11-03T09:12:00.412Z'
                    data:
                      now_serving: 31600
                      rate_per_min: 318
                      state: OPEN
                      server_time: '2026-10-24T13:10:00.412Z'
                      poll_after_ms: 1000
                      poll_tiers:
                      - max_position: 10
                        poll_after_ms: 1000
                      - max_position: 100
                        poll_after_ms: 2000
                      - max_position: 1000
                        poll_after_ms: 5000
                      - max_position: null
                        poll_after_ms: 10000
  /events/{event_id}/tickets:
    get:
      tags:
      - Booking
      summary: Get Ticket Selection Page
      operationId: getTicketSelection
      description: |-
        Ticket selection.

        GET yang mengubah state: pemuatan pertama meng-claim booking GRANTED → SELECTING, hanya sebelum tenggat (setelahnya booking tetap GRANTED dan menjadi LAPSED). Booking yang sudah selesai (LAPSED, EXPIRED, CONFIRMED, ABANDONED) atau grant untuk event lain → 401 GRANT_TOKEN_INVALID. Cache-Control: no-store.

        v2.14: account {email, nik_masked} untuk customer login (null untuk tamu), untuk mengisi form lebih dulu.

        v2.20: Authorization: Bearer wajib bila grant milik akun login (401 UNAUTHORIZED / TOKEN_EXPIRED / TOKEN_INVALID).
      parameters:
      - name: event_id
        in: path
        required: true
        schema:
          type: string
        example: evt_konser_a
      - name: X-Grant-Token
        in: header
        required: true
        description: Grant slot dari GET /queue/me. Wajib — ini yang menjaga endpoint ini.
        schema:
          type: string
        example: gt_abc123
      - name: X-Device-Id
        in: header
        required: false
        description: Pengikatan device untuk grant anonim — WAJIB bila pemanggil tidak login. Acak 128 bit dari klien; server
          menyimpan HMAC-nya. Tidak cocok → 401 DEVICE_MISMATCH.
        schema:
          type: string
        example: d3f1a9c4b70e42f88a1c5e6072b9d4af
      - name: Authorization
        in: header
        required: false
        description: Bearer access token akun. WAJIB bila grant milik akun login (harus akun yang sama dengan grant); tamu
          tidak mengirimnya. Hilang/akun lain → 401 UNAUTHORIZED, kedaluwarsa → 401 TOKEN_EXPIRED, tidak sah → 401 TOKEN_INVALID
        schema:
          type: string
        example: Bearer eyJhbGciOi…
      responses:
        '200':
          description: Ticket categories
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    type: object
                    properties:
                      code:
                        type: integer
                        example: 200
                      message:
                        type: string
                        example: Success
                      server_time:
                        type: string
                        format: date-time
                        example: '2026-11-03T09:12:00.412Z'
                        description: Jam server, ada di SETIAP respons; klien menyinkronkan jamnya dari sini (BR-10)
                  data:
                    type: object
                    properties:
                      event:
                        type: object
                        properties:
                          id:
                            type: string
                            example: evt_konser_a
                          name:
                            type: string
                            example: Konser A
                          date:
                            type: string
                            example: '2026-12-25'
                          venue:
                            type: string
                            example: GBK, Jakarta
                          image_url:
                            type: string
                            example: https://cdn.rusuh.id/events/konser-a.jpg
                      session:
                        type: object
                        properties:
                          expires_at:
                            type: string
                            example: '2026-10-23T13:15:00Z'
                            description: 'Tenggat yang sedang berlaku: booking_expires_at (5 menit sejak giliran) sampai tombol
                              Bayar ditekan; sejak HELD, payment_expires_at'
                          server_time:
                            type: string
                            example: '2026-10-23T13:10:13Z'
                      categories:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              example: cat_vip
                            name:
                              type: string
                              example: VIP
                            description:
                              type: string
                              example: Lebih dekat.
                            price:
                              type: integer
                              example: 1500000
                            available:
                              type: integer
                              example: 12
                              description: Stok hidup (Redis); negatif ditampilkan 0. Stok tidak diketahui → 503 STOCK_UNINITIALIZED,
                                bukan 0
                            max_per_order:
                              type: integer
                              example: 3
                              description: min(batas kategori, available, 3); 0 bila habis
                        description: Urutan tampilan (sort_order), bukan urutan id
                      rules:
                        type: object
                        properties:
                          max_tickets_per_order:
                            type: integer
                            example: 3
                          one_nik_per_ticket:
                            type: boolean
                            example: true
                      account:
                        type:
                        - object
                        - 'null'
                        description: 'Customer login: email dan NIK tersamar dari akunnya, untuk mengisi form lebih dulu (dapat
                          diubah). Tamu: null. NIK lengkap tidak pernah dikirim (NFR-11)'
                        properties:
                          email:
                            type: string
                            example: buyer@example.com
                          nik_masked:
                            type:
                            - string
                            - 'null'
                            example: 3171**********22
                            description: null bila akun belum punya NIK terverifikasi
              examples:
                Success (logged in):
                  value:
                    meta:
                      code: 200
                      message: Success
                      server_time: '2026-11-03T09:12:00.412Z'
                    data:
                      event:
