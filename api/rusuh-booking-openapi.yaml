  /payments/{booking_id}/status:
    get:
      tags:
      - Payment
      summary: Get Payment Status
      operationId: getPaymentStatus
      description: |-
        Payment status.

        reason adalah PASSTHROUGH status_message dari penyedia, untuk support — bukan teks tampilan. Kartu kredit tidak dibuka di POC ini, jadi contoh bernuansa kartu menyesatkan.

        v2.20: Authorization: Bearer wajib bila grant milik akun login (401 UNAUTHORIZED / TOKEN_EXPIRED / TOKEN_INVALID).

        v2.25: di WebView pembayaran, X-Payment-Session menggantikan X-Grant-Token (+ X-Device-Id / Authorization). Lihat api-contracts §5 dan ADR-007.
      parameters:
      - name: booking_id
        in: path
        required: true
        schema:
          type: string
        example: RB-00912
      - name: X-Grant-Token
        in: header
        required: false
        description: Grant slot dari GET /queue/me. Wajib — ini yang menjaga endpoint ini. Wajib, KECUALI di WebView pembayaran
          yang mengirim X-Payment-Session sebagai gantinya (v2.25, ADR-007).
        schema:
          type: string
        example: gt_abc123
      - name: X-Device-Id
        in: header
        required: false
        description: Pengikatan device untuk grant anonim — WAJIB bila pemanggil tidak login. Acak 128 bit dari klien; server
          menyimpan HMAC-nya. Tidak cocok → 401 DEVICE_MISMATCH.
        schema:
          type: string
        example: d3f1a9c4b70e42f88a1c5e6072b9d4af
      - name: Authorization
        in: header
        required: false
        description: Bearer access token akun. WAJIB bila grant milik akun login (harus akun yang sama dengan grant); tamu
          tidak mengirimnya. Hilang/akun lain → 401 UNAUTHORIZED, kedaluwarsa → 401 TOKEN_EXPIRED, tidak sah → 401 TOKEN_INVALID
        schema:
          type: string
        example: Bearer eyJhbGciOi…
      - name: X-Payment-Session
        in: header
        required: false
        description: 'Hanya di WebView pembayaran (ADR-007): payment_session dari POST /payments/handoff/exchange, PENGGANTI
          X-Grant-Token + X-Device-Id + Authorization. Dikirim bersama X-Grant-Token → 400 VALIDATION_ERROR; X-Device-Id /
          Authorization yang ikut terkirim diabaikan. Tidak dikenal / grant sudah dihapus → 401 PAYMENT_SESSION_INVALID; booking
          lain → 404 NOT_FOUND.'
        schema:
          type: string
        example: ps_bTN4V1pLc0c2cWJ2Tk5yUjhYa0ZqZEw3a1R1aEVwWg
      responses:
        '200':
          description: Payment status
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    type: object
                    properties:
                      code:
                        type: integer
                        example: 200
                      message:
                        type: string
                        example: Payment pending
                      server_time:
                        type: string
                        format: date-time
                        example: '2026-11-03T09:12:00.412Z'
                        description: Jam server, ada di SETIAP respons; klien menyinkronkan jamnya dari sini (BR-10)
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        example: PENDING
                      server_time:
                        type: string
                        example: '2026-10-23T13:22:00Z'
                      expires_at:
                        type: string
                        format: date-time
                        example: '2026-10-23T13:25:00Z'
                        description: Tenggat pembayaran (payment_expires_at). Klien menghitung mundur dari sini dengan jam
                          yang dikoreksi server_time. Hanya saat PENDING
                      payment_id:
                        type: string
                        description: 'order_id di Midtrans: {booking_id}:{attempt}.'
                        examples:
                        - RB-00912:1
                      method:
                        type: string
                        description: bank_transfer atau gopay (= payment_type Midtrans).
                        examples:
                        - bank_transfer
                      total_amount:
                        type: integer
                        description: gross_amount yang DIKIRIM ke gateway, bukan penjumlahan ulang booking_items.
                        examples:
                        - 3000000
                      payment_status:
                        type: string
                        description: 'transaction_status milik GATEWAY untuk notifikasi terakhir yang DITINDAKLANJUTI. BUKAN
                          field status pada respons yang sama: status adalah posisi booking, ini status gateway di balik posisi
                          itu. Notifikasi yang diterima tetapi tidak ditindaklanjuti tidak mengubahnya — khususnya capture
                          dengan fraud_status selain accept (terotorisasi tetapi belum dibayar) tidak pernah muncul di sini,
                          karena akan terbaca sebagai uang yang sudah diterima. Urutan lengkapnya ada di payment_events.'
                        examples:
                        - settlement
                      instructions:
                        type: object
                        description: 'Objek yang sama dengan §5.2: {bank, va_number} untuk transfer, {qr_url, deeplink_url}
                          untuk e-wallet. Ada di sini supaya customer yang menutup tab tidak kehilangan nomor virtual account.'
                        additionalProperties:
                          type: string
                        examples:
                        - bank: bca
                          va_number: '8801234567890'
              examples:
                Pending:
                  value:
                    meta:
                      code: 200
                      message: Payment pending
                      server_time: '2026-11-03T09:12:00.412Z'
                    data:
                      status: PENDING
                      expires_at: '2026-10-23T13:25:00Z'
                      server_time: '2026-10-23T13:22:00Z'
                Paid:
                  value:
                    meta:
                      code: 200
                      message: Payment successful
                      server_time: '2026-11-03T09:12:00.412Z'
                    data:
                      status: PAID
                      paid_at: '2026-10-23T13:23:00Z'
                      redirect_url: /bookings/RB-00912/success
                Failed:
                  value:
                    meta:
                      code: 200
                      message: Payment failed
                      server_time: '2026-11-03T09:12:00.412Z'
                    data:
                      status: FAILED
                      reason: Pembayaran ditolak penyedia
                      can_retry: true
                      attempt: 2
                      payment_expires_at: '2026-10-25T10:25:00Z'
                      server_time: '2026-10-25T10:19:40Z'
        '400':
          description: VALIDATION_ERROR — VALIDATION_ERROR
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    type: object
                    properties:
                      code:
