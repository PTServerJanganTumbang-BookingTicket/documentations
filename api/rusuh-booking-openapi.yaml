      - Payment
      summary: Create Payment Handoff Code
      operationId: createPaymentHandoff
      description: 'Aplikasi mobile meminta kode sekali pakai (60 detik) untuk membuka halaman pembayaran web di WebView (ADR-007,
        api-contracts §5.6, v2.25; payment_url v2.26). Kredensial grant lengkap wajib; X-Payment-Session tidak diterima. Tanpa
        body. Status yang diterima: HELD, AWAITING_PAYMENT, PENDING_CANCELLATION. Respons membawa payment_url (https://rush-my-ticket.my.id/m/orders/{booking_id}/pay#code={handoff_code});
        aplikasi membukanya apa adanya setelah memastikan diawali https://rush-my-ticket.my.id/m/orders/ (kode di fragment,
        bukan query).'
      parameters:
      - name: booking_id
        in: path
        required: true
        schema:
          type: string
        example: RB-00912
      - name: X-Grant-Token
        in: header
        required: true
        description: Grant slot dari GET /queue/me. Wajib — ini yang menjaga endpoint ini.
        schema:
          type: string
        example: gt_abc123
      - name: X-Device-Id
        in: header
        required: false
        description: Pengikatan device untuk grant anonim — WAJIB bila pemanggil tidak login. Acak 128 bit dari klien; server
          menyimpan HMAC-nya. Tidak cocok → 401 DEVICE_MISMATCH.
