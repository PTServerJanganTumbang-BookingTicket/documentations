openapi: 3.0.3
info:
  title: Rusuh Booking Tiket API
  version: "2.4"
  description: |
    API contracts untuk sistem penjualan tiket konser Rusuh dengan Virtual Waiting Room.

    Selaras dengan **ADR-005** (Keputusan Arsitektur Final — SSE + ECS Fargate).

    ### Dua Surface Berbeda
    | Surface | Host | Transport |
    |---|---|---|
    | REST API | `api.rusuhtiket.com` (API Gateway) | HTTP/JSON |
    | SSE Stream | `events.rusuhtiket.com` (ALB) | `text/event-stream` |

    ### Autentikasi

    Empat kredensial, empat slot transport. Tidak ada satu slot pun yang membawa lebih dari
    satu jenis — middleware memilih per rute, tidak mencoba memverifikasi tanda tangan lalu
    jatuh ke pencarian Redis. Sampai v2.2 ketiganya berbagi `Authorization: Bearer`.

    | Kredensial | Slot | Membuktikan |
    |---|---|---|
    | Access Token (sesi akun) | `Authorization: Bearer` | siapa pemegangnya |
    | Grant Token | `X-Grant-Token` | pemegangnya punya slot |
    | Queue Token (ruang tunggu) | cookie `queue_token` (web) / `X-Queue-Token` (mobile) | posisinya dalam antrian |
    | E-ticket Token | query `?t=` pada tautan email | hak baca satu tiket |

    Pengikatan tambahan, bukan slot kredensial: `X-Device-Id` mengikat grant **anonim** ke
    perangkat yang menerimanya. Acak 128 bit yang dibuat klien, disimpan server sebagai HMAC;
    bukan fingerprint pasif. Customer login tidak mengirimnya — `account_id` mengikat lebih kuat.

    - **Queue Token**: cookie `HttpOnly` `queue_token` (web) atau header `X-Queue-Token`
      (mobile). Web memakai cookie karena `EventSource` tidak dapat menyetel header request.
      Token TIDAK pernah dikirim via query string.
    - **Grant Token**: opaque (`gt_…`, bukan JWT), diperoleh setelah giliran tiba via
      `GET /queue/me`, dikirim sebagai `X-Grant-Token`. Menjaga seluruh endpoint booking dan
      payment. Tersimpan di Redis, sehingga dapat dicabut seketika — tidak seperti access
      token. Diterbitkan untuk tamu juga, karena tamu boleh membeli.
    - **Access Token**: JWT sesi akun, diperoleh setelah login via `GET /auth/verify` atau
      `POST /auth/refresh`.
      Dikirim sebagai `Authorization: Bearer {access_token}`. Berlaku **22740 detik**
      — angka yang sama dengan `GRANT_TOKEN_TTL_SECONDS`, diturunkan dari perjalanan
      customer (ADR-005 §7: 300 booking + 600 pembayaran + 30 grace + margin) sehingga
      sesi hidup lebih lama daripada journey. Karena token ini stateless, umurnya
      sekaligus jendela pencabutannya.
    - **Refresh Token**: opaque (bukan JWT), berlaku 30 hari, sekali pakai dengan
      rotasi. Ditukar di `POST /auth/refresh`. Server menyimpan hash-nya saja, dan
      pemutaran ulang token yang sudah terpakai mencabut seluruh keluarga token.

    ### Pola Respons
    Semua endpoint menggunakan envelope `{ meta, data }`.
    Field `server_time` hadir di setiap respons agar klien dapat menyinkronkan jam (BR-10).

    ### Status Antrian
    Setelah `POST /events/{id}/queue/join`, klien membuka SSE stream.
    Posisi dihitung klien: `position = ticket_no − nowServing`.
    Saat menerima event `grant`, klien memanggil `GET /events/{id}/queue/me` untuk mendapat `grant_token`.

servers:
  - url: https://api.rusuh.id/v1
    description: Production

tags:
  - name: Authentication
    description: Magic link login, refresh sesi, dan registrasi akun
  - name: Accounts
    description: Manajemen NIK tersimpan (Daftar_NIK_Teman)
  - name: Events
    description: Daftar dan detail event konser
  - name: Queue
    description: Virtual Waiting Room — join, stream SSE, status re-entrancy, polling fallback
  - name: Booking
    description: Pemilihan tiket dan pembuatan booking
  - name: NIK
    description: Validasi NIK ke Dukcapil
  - name: Payment
    description: Inisiasi pembayaran, status, webhook gateway
  - name: User
    description: Tiket milik user dan e-ticket
  - name: Admin
    description: Rekonsiliasi operasional (bukan jalur customer)

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Access token JWT **sesi akun**, diterbitkan `GET /auth/verify` atau
        `POST /auth/refresh`. Ini satu-satunya kredensial yang pernah menempati slot
        `Authorization`. Ia TIDAK dikirim ke endpoint booking/payment sama sekali: sejak v2.4
        `bookings.account_id` diambil dari keterlibatan pada INSERT saat GRANT, bukan dari
        kredensial yang dibawa klien saat checkout.
    GrantToken:
      type: apiKey
      in: header
      name: X-Grant-Token
      description: >
        Grant slot opaque (`gt_…`), diperoleh dari `GET /events/{event_id}/queue/me` setelah
        event `grant`. Membuktikan pemegangnya punya slot, bukan siapa dirinya — tamu
        mendapatkannya juga. Wajib pada seluruh endpoint booking dan payment. Tersimpan di
        `grant:{token} EX GRANT_TOKEN_TTL_SECONDS`, jadi setiap verifikasi membacanya dari
        Redis dan satu `DEL` mencabutnya.
    QueueTokenCookie:
      type: apiKey
      in: cookie
      name: queue_token
      description: >
        Cookie HttpOnly yang di-set server saat `POST /queue/join`, membuktikan posisi dalam
        antrian. Dipakai web, termasuk oleh SSE stream — `EventSource` tidak dapat menyetel
        header request. Klien mobile memakai `X-Queue-Token`.
        `Max-Age` adalah batas atas: keadaan terminal menghapus kredensialnya lebih cepat, dan
        `CONFIRMED` menggantinya dengan nisan yang tidak memulihkan apa pun.
    ETicketToken:
      type: apiKey
      in: query
      name: t
      description: >
        HMAC bertanda tangan atas satu `ticket_id` + kedaluwarsa, dikirim pada tautan di email
        e-tiket. Tanpa identitas akun, lingkup satu tiket, berlaku sampai tanggal event + 1
        hari. Ada karena FR-26 mengirim tiket ke masing-masing pemegang NIK, dan pemegang NIK
        umumnya tidak punya akun — rute yang hanya menerima sesi akun membuat tombol di email
        mereka menjawab 401.
    QueueTokenHeader:
      type: apiKey
      in: header
      name: X-Queue-Token
      description: >
        Token ruang tunggu yang sama, untuk klien mobile yang tidak punya cookie store.
        Bukan `Authorization`: slot itu milik sesi akun.

  schemas:
    Meta:
      type: object
      properties:
        code:
          type: integer
          example: 200
        message:
          type: string
          example: Success

    MetaPagination:
      allOf:
        - $ref: "#/components/schemas/Meta"
        - type: object
          properties:
            pagination:
              type: object
              properties:
                totalData:
                  type: integer
                totalPage:
                  type: integer
                limit:
                  type: integer
                offset:
                  type: integer

    ErrorResponse:
      type: object
      properties:
        meta:
          $ref: "#/components/schemas/Meta"
        data:
          type: object

    EventDisplay:
      type: object
      description: Keputusan server untuk rendering tombol — klien tidak menghitung ulang logika ini.
      properties:
        enabled:
          type: boolean
        action:
          type: string
          enum: [JOIN_QUEUE, GO_TO_TICKETS, NONE]
        label_key:
          type: string
          enum: [sold_out, coming_soon, queue_full, buy_now, join_queue]
        badge_key:
          type: string
          nullable: true
          enum: [selling_out_fast]

    TicketCategory:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        price:
          type: integer
        available:
          type: integer
        status:
          type: string
          enum: [AVAILABLE, SOLD_OUT]

    PaymentTtl:
      type: object
      properties:
        expires_at:
          type: string
          format: date-time
        ttl_seconds:
          type: integer
        server_time:
          type: string
          format: date-time

paths:
  # ──────────────────────────────────────────────
  #  AUTHENTICATION
  # ──────────────────────────────────────────────

  /auth/magic-link:
    post:
      tags: [Authentication]
      summary: Request Magic Link (Login)
      operationId: requestMagicLink
      description: |
        Mengirim login link ke email. UI: "Send Login Link" button.
        **Requirement**: FR-31
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
            example:
              email: you@example.com
      responses:
        "200":
          description: Login link sent to email
          content:
            application/json:
              example:
                meta:
                  code: 200
                  message: Login link sent to your email
        "429":
          description: Rate limited — too many requests
          content:
            application/json:
              example:
                meta:
                  code: 429
                  message: Please wait before requesting another link
                data:
                  retry_after: 60

  /auth/magic-link/resend:
    post:
      tags: [Authentication]
      summary: Resend Magic Link
      operationId: resendMagicLink
      description: |
        Kirim ulang login link. UI: "Resend Login Link" button di "Check your inbox" screen.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
            example:
              email: you@example.com
      responses:
        "200":
          description: New login link sent
          content:
            application/json:
              example:
                meta:
                  code: 200
                  message: New login link sent

  /auth/verify:
    get:
      tags: [Authentication]
      summary: Verify Magic Link Token
      operationId: verifyMagicLink
      description: |
        Verifikasi token dari link email. Ini adalah redirect target dari email login link.

        Mengembalikan `redirect_context` bila user kembali ke booking yang sedang berlangsung (BR-09).
        **Requirement**: FR-31, BR-09
      parameters:
        - name: magic_token
          in: cookie
          required: true
          schema:
            type: string
          description: Token dari email link
      responses:
        "200":
          description: Login successful
          headers:
            Set-Cookie:
              schema:
                type: string
              description: "access_token cookie"
          content:
            application/json:
              example:
                meta:
                  code: 200
                  message: Login successful
                data:
                  access_token: eyJhbG...
                  refresh_token: eyJhbG...
                  expires_in: 22740
                  user:
                    id: usr_123
                    email: you@example.com
                    nik: "3171xxxxxxxxxx22"
                  redirect_context:
                    type: booking
                    event_id: evt_konser_a
                    booking_id: RB-00912
                    message: Booking context restored
        "401":
          description: Invalid or expired magic token

  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Refresh Session
      operationId: refreshSession
      description: |
        Menukar refresh token dengan pasangan token baru.

        Dipanggil klien saat access token mendekati kedaluwarsa, atau setelah
        menerima `401 TOKEN_EXPIRED`.

        Access token berlaku 22740 detik — mencakup penantian antrian dan perjalanan
        930 detik — sehingga endpoint ini **tidak** dipanggil di tengah journey, dan
        juga tidak di ruang tunggu. Ia
        ada untuk sesi yang berumur hari — refresh token berlaku 30 hari — bukan
        untuk menambal token yang terlalu pendek. Sebuah refresh yang gagal di
        halaman pembayaran akan memutus customer, dan NFR-02 melarangnya.

        **Rotasi.** Setiap panggilan mengembalikan refresh token baru dan
        menghanguskan yang dikirim. Klien wajib mengganti salinan simpanannya;
        bila tidak, panggilan berikutnya terbaca sebagai pemutaran ulang.

        **Pemutaran ulang mencabut seluruh keluarga token.** Token sekali-pakai
        yang muncul dua kali berarti kredensial bocor, dan yang memegang mata
        rantai terbaru bisa jadi penyerang — mencabut satu token saja justru
        mempertahankan aksesnya (OAuth 2.0 BCP §4.13).

        Token dikirim di body, bukan header `Authorization`: pada endpoint ini ia
        adalah objek permintaan, dan menjauhkannya dari header itu mencegahnya
        tercatat oleh proxy yang me-log header.

        **Requirement**: FR-31, BR-09, NFR-02, NFR-07
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
                  description: Refresh token opaque dari `GET /auth/verify` atau dari panggilan refresh sebelumnya
            example:
              refresh_token: 8Kq2mN9vL4wX1yB6cF3dH5jG0aZpR7tS
      responses:
        "200":
          description: Session refreshed
          headers:
            Set-Cookie:
              schema:
                type: string
              description: "access_token cookie (HttpOnly, Secure, SameSite=Strict)"
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    type: object
                    properties:
                      code:
                        type: integer
                      message:
                        type: string
                  data:
                    type: object
                    properties:
                      access_token:
                        type: string
                        description: JWT HS256, berlaku `expires_in` detik
                      refresh_token:
                        type: string
                        description: Pengganti yang baru — token yang dikirim sudah hangus
                      expires_in:
                        type: integer
                        description: Masa berlaku access token dalam detik
              example:
                meta:
                  code: 200
                  message: Session refreshed
                data:
                  access_token: eyJhbG...
                  refresh_token: wB3nT8kM2pQ7vF1xJ9cL5gH4dZ6yA0sR
                  expires_in: 22740
        "400":
          description: "`VALIDATION_ERROR` — field `refresh_token` kosong atau absen"
          content:
            application/json:
              example:
                meta:
                  code: 400
                  message: refresh_token is required
                data: {}
        "401":
          description: |
            Sesi tidak dapat diperpanjang. Dua sebab, dibedakan di kode tetapi tidak di pesan:

            - `TOKEN_INVALID` — token **sudah pernah dipakai** (pemutaran ulang; seluruh
              keluarga token dicabut), atau akunnya sudah tidak ada
            - `TOKEN_EXPIRED` — token kedaluwarsa, dicabut, atau tidak dikenal

            Pesannya sama agar penyerang tidak diberi tahu bahwa ia memicu deteksi pencurian.
          content:
            application/json:
              example:
                meta:
                  code: 401
                  message: Session ended; please sign in again
                data: {}

  /auth/register:
    post:
      tags: [Authentication]
      summary: Register Account
      operationId: registerAccount
      description: |
        Buat akun baru dengan email dan NIK.

        NIK diverifikasi ke Dukcapil **sekali di sini** dan terikat permanen ke akun.
        Setelah itu pembelian tidak memanggil Dukcapil lagi untuk NIK pembeli.

        Consent wajib diisi dan tidak boleh pre-checked (UU PDP No. 27/2022).
        **Requirement**: FR-29, FR-30, FR-31
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, nik, consent]
              properties:
                email:
                  type: string
                  format: email
                nik:
                  type: string
                  minLength: 16
                  maxLength: 16
                  description: NIK 16 digit. Wajib. Diverifikasi Dukcapil.
                name:
                  type: string
                consent:
                  type: object
                  required: [accepted, policy_version]
                  properties:
                    accepted:
                      type: boolean
                      description: Persetujuan pemrosesan NIK pihak ketiga. Checkbox tidak boleh pre-checked.
                    policy_version:
                      type: string
                      description: Versi kebijakan privasi yang ditampilkan saat registrasi
            example:
              email: alex@example.com
              nik: "3171xxxxxxxxxx22"
              name: ALEX
              consent:
                accepted: true
                policy_version: "2026-10-01"
      responses:
        "200":
          description: Verification link sent
          content:
            application/json:
              example:
                meta:
                  code: 200
                  message: Verification link sent to your email
                data:
                  user_id: usr_456
        "400":
          description: Validation error (e.g. NIK format)
          content:
            application/json:
              example:
                meta:
                  code: 400
                  message: NIK must be exactly 16 digits
                data: {}
        "409":
          description: NIK sudah terdaftar di akun lain (NIK_ALREADY_REGISTERED)
          content:
            application/json:
              example:
                meta:
                  code: 409
                  message: NIK already registered to another account
                data: {}
        "422":
          description: Consent belum dicentang (CONSENT_REQUIRED)
        "429":
          description: Rate limited — 5 akun baru per IP per jam

  # ──────────────────────────────────────────────
  #  ACCOUNTS — SAVED NIKs
  # ──────────────────────────────────────────────

  /accounts/me/saved-niks:
    get:
      tags: [Accounts]
      summary: List Saved NIKs (Daftar NIK Teman)
      operationId: listSavedNiks
      description: |
        NIK yang sering diajak hadir bersama, disimpan sekali dan dipakai berulang tanpa memanggil Dukcapil lagi.
        Maksimal 5 per akun. Tidak tersedia untuk guest.
        **Requirement**: FR-15a
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of saved NIKs
          content:
            application/json:
              example:
                meta:
                  code: 200
                  message: Success
                data:
                  max_entries: 5
                  saved_niks:
                    - id: snk_1
                      nik_masked: "3171********22"
                      label: Budi
                      verified_at: "2026-10-20T08:11:00Z"
                      status: VERIFIED

    post:
      tags: [Accounts]
      summary: Add Saved NIK
      operationId: addSavedNik
      description: |
        Menambah NIK ke daftar tersimpan. Dukcapil dipanggil di sini — baris hanya dibuat bila jawaban valid.
        NIK lengkap tidak pernah dikembalikan, hanya bentuk ter-mask.
        **Requirement**: FR-15a, NFR-14
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nik, label]
              properties:
                nik:
                  type: string
                  minLength: 16
                  maxLength: 16
                label:
                  type: string
            example:
              nik: "3171xxxxxxxxxx33"
              label: Budi
      responses:
        "201":
          description: NIK saved and verified by Dukcapil
        "409":
          description: |
            - `MAX_SAVED_NIKS_REACHED` — sudah 5 entri, hapus salah satu dulu
            - `NIK_ALREADY_SAVED` — NIK sudah ada di daftar akun ini
        "422":
          description: Consent belum diberikan (CONSENT_REQUIRED) atau NIK ditolak Dukcapil
        "503":
          description: Dukcapil tidak tersedia (DUKCAPIL_UNAVAILABLE) — tidak ada entri parsial

  /accounts/me/saved-niks/{id}:
    delete:
      tags: [Accounts]
      summary: Delete Saved NIK
      operationId: deleteSavedNik
      description: |
        Hapus NIK dari daftar tersimpan.
        Penghapusan tidak memengaruhi tiket yang sudah dibeli dengan NIK tersebut.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: snk_1
      responses:
        "204":
          description: NIK deleted
        "404":
          description: Saved NIK not found

  # ──────────────────────────────────────────────
  #  EVENTS
  # ──────────────────────────────────────────────

  /events:
    get:
      tags: [Events]
      summary: List Events
      operationId: listEvents
      description: |
        Menampilkan daftar event. UI: Home Page "Daftar Event".

        Response di-cache CDN **30 detik**. `queue_depth` adalah perkiraan; penegak sebenarnya
        adalah pemeriksaan atomik saat `POST /queue/join`.

        Label `display.label_key` adalah kunci i18n — teks diterjemahkan di frontend (FR-32).
        **Requirement**: FR-01, FR-02, FR-03
      parameters:
        - name: filter
          in: query
          schema:
            type: string
            enum: [all, available, upcoming]
          description: "`available` = status != SOLD_OUT; `upcoming` = queue_state == NOT_OPEN"
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
            maximum: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of events with display directives
          content:
            application/json:
              example:
                meta:
                  code: 200
                  message: Success
                  pagination:
                    totalData: 2
                    totalPage: 1
                    limit: 10
                    offset: 0
                data:
                  - id: evt_konser_a
                    name: Konser A — Jakarta
                    category: LIVE MUSIC
                    location:
                      venue: GBK
                      city: Jakarta
                    date: "2026-12-25"
                    image_url: https://cdn.rusuh.id/events/konser-a.jpg
                    status: SELLING_OUT_FAST
                    queue_state: FULL
                    queue_depth: 300000
                    queue_capacity: 300000
                    sale_starts_at: "2026-11-10T02:00:00Z"
                    display:
                      enabled: false
                      action: NONE
                      label_key: queue_full
                      badge_key: null
                    min_price: 500000
                    max_price: 1500000
                  - id: evt_konser_b
                    name: Konser B — Bandung
                    category: LIVE MUSIC
                    location:
                      venue: GOR Saparua
                      city: Bandung
                    date: "2027-01-10"
                    image_url: https://cdn.rusuh.id/events/konser-b.jpg
                    status: SOLD_OUT
                    queue_state: OPEN
                    queue_depth: 0
                    queue_capacity: 300000
                    sale_starts_at: "2026-10-20T02:00:00Z"
                    display:
                      enabled: false
                      action: NONE
                      label_key: sold_out
                      badge_key: null
                    min_price: null
                    max_price: null

  /events/{event_id}:
    get:
      tags: [Events]
      summary: Get Event Detail
      operationId: getEvent
      description: |
        Detail event beserta kategori tiket dan ketersediaan stok. UI: Event Detail sidebar.
        **Requirement**: FR-11, FR-12
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: string
          example: evt_konser_a
      responses:
        "200":
          description: Event detail with ticket categories
          content:
            application/json:
              example:
                meta:
                  code: 200
                  message: Success
                data:
                  id: evt_konser_a
                  name: Konser A — Jakarta
                  category: LIVE MUSIC
                  location:
                    venue: GBK
                    city: Jakarta
                  date: "2026-12-25"
                  time: "19:00"
                  image_url: https://cdn.rusuh.id/events/konser-a.jpg
                  description: Energi panggung. Cerita yang kamu bawa pulang.
                  status: AVAILABLE
                  queue_state: OPEN
                  queue_depth: 1248
                  queue_capacity: 300000
                  sale_starts_at: "2026-11-10T02:00:00Z"
                  display:
                    enabled: true
                    action: JOIN_QUEUE
                    label_key: join_queue
                    badge_key: null
                  ticket_categories:
                    - id: cat_vip
                      name: VIP
                      description: Lebih dekat dengan energi panggung.
                      price: 1500000
                      available: 12
                      status: AVAILABLE
                    - id: cat_festival
                      name: Festival
                      description: Nikmati konser dari area festival.
                      price: 850000
                      available: 240
                      status: AVAILABLE
                    - id: cat_tribune
                      name: Tribune
                      description: Area tribun dengan panorama panggung.
                      price: 500000
                      available: 0
                      status: SOLD_OUT
        "404":
          description: Event not found

  # ──────────────────────────────────────────────
  #  QUEUE
  # ──────────────────────────────────────────────

  /events/{event_id}/queue/join:
    post:
      tags: [Queue]
      summary: Join Queue
      operationId: joinQueue
      description: |
        User bergabung ke antrian. Dipanggil saat klik "Beli Tiket" / "Masuk Antrian".

        **FR-05 — Bypass antrian kosong**: bila `queue_depth == 0` dan stok tersedia,
        Lua memberi grant pada permintaan yang sama. Respons berisi `granted: true` dan
        `grant_token` — klien langsung ke Detail Ticket tanpa membuka SSE stream.

        **Re-entrancy**: user yang sudah di antrian mendapat posisi lama kembali.

        Server meng-set cookie:
        ```
        Set-Cookie: queue_token=qt_xyz789; HttpOnly; Secure; SameSite=Strict; Max-Age=7200
        ```
        **Requirement**: FR-04, FR-05, FR-10, NFR-05
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: string
          example: evt_konser_a
        - name: X-Device-Id
          in: header
          required: false
          description: >
            Acak 128 bit yang dibuat klien, disimpan server sebagai HMAC(DEVICE_PEPPER, …) pada
            keterlibatan dan dicocokkan pada setiap panggilan ber-grant. WAJIB bila pemanggil
            tidak login — grant tanpa pengikatan tidak dapat diikat belakangan, jadi tamu yang
            tidak mengirimnya ditolak di sini dengan 400 DEVICE_ID_REQUIRED, bukan nanti.
          schema:
            type: string
        - name: Authorization
          in: header
          required: false
          description: >
            `Bearer {access_token}` bila customer login. Satu-satunya tempat di jalur antrian
            yang menerimanya, karena dua hal butuh identitas akun tepat pada saat join:
            penegakan BR-07 lewat acct:{ev}:{account_id}, dan `account_id` pada keterlibatan —
            yang kemudian menjadi `bookings.account_id` pada INSERT saat GRANT, tanpa pernah
            menanyakan klien lagi.
          schema:
            type: string
      responses:
        "200":
          description: Joined queue / rejoined existing position
          headers:
            Set-Cookie:
              schema:
                type: string
              description: queue_token HttpOnly cookie
          content:
            application/json:
              examples:
                joined:
                  summary: New queue position
                  value:
                    meta:
                      code: 200
                      message: Successfully joined queue
                    data:
                      ticket_no: 32748
                      now_serving: 31500
                      position: 1248
                      estimated_wait_minutes: 4
                      sse_url: /queue/stream
                      event:
                        id: evt_konser_a
                        name: Konser A — Jakarta
                rejoined:
                  summary: Rejoined existing position
                  value:
                    meta:
                      code: 200
                      message: Rejoined existing queue position
                    data:
                      ticket_no: 32748
                      now_serving: 31520
                      position: 1228
                      estimated_wait_minutes: 4
                      sse_url: /queue/stream
                      rejoined: true
                bypass:
                  summary: Queue empty — granted immediately (FR-05)
                  value:
                    meta:
                      code: 200
                      message: No queue — access granted
                    data:
                      granted: true
                      grant_token: gt_abc123
                      booking_expires_at: "2026-11-10T02:05:00Z"
                      server_time: "2026-11-10T02:00:00Z"
        "503":
          description: Queue full (QUEUE_FULL)
          content:
            application/json:
              example:
                meta:
                  code: 503
                  message: Antrian sedang penuh, silakan coba beberapa saat lagi
                data:
                  queue_state: FULL
                  queue_capacity: 300000

  /events/{event_id}/queue/stream:
    get:
      tags: [Queue]
      summary: Queue Status Stream (SSE)
      operationId: queueStream
      description: |
        **Server-Sent Events** stream untuk update posisi real-time.
        Klien connect setelah berhasil join queue.

        > ⚠️ Endpoint ini dilayani oleh ALB (`events.rusuhtiket.com`), bukan API Gateway.

        **Autentikasi**: Cookie `queue_token` (web — EventSource tidak dapat menyetel header) | `X-Queue-Token` header (mobile). Bukan `Authorization`: slot itu milik sesi akun.
        Token TIDAK pernah dikirim via query string (akan tercatat di access log).

        **Event types yang dikirim server**:

        | Event | Kapan | Payload |
        |---|---|---|
        | *(unnamed, default)* | Tiap `nowServing` berubah, `paused` berubah, atau 10 detik (heartbeat) | `{nowServing, state, ratePerMin, paused, serverTime}` |
        | `grant` | Giliran customer tiba (slot sudah diamankan) | `{}` — klien memanggil `GET /queue/me` |
        | `status` | Koneksi Redis bermasalah | `{stale: bool}` |
        | `sold-out` | Tiket habis saat menunggu | `{message}` — klien **WAJIB** `es.close()` |
        | `reconnect` | Task sedang shutdown | Retry jitter 1–15 detik |
        | `: keepalive` | Setiap 15 detik | Komentar SSE (tidak memicu handler) |

        **Snapshot awal** dikirim segera saat koneksi terbuka — posisi utuh tanpa menunggu tick berikutnya (FR-10).

        Klien menghitung posisi: `position = ticket_no − nowServing`.
        Saat `paused = true` tampilkan banner; jangan tampilkan error — antrian tidak hilang.

        **HTTP 410 Gone** bila event sudah sold out — `EventSource` berhenti permanen.
        **Requirement**: FR-07, FR-08, FR-09, FR-10, BR-10, NFR-06
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: string
          example: evt_konser_a
        - name: X-Queue-Token
          in: header
          description: "Token ruang tunggu — untuk mobile. Web pakai cookie `queue_token`, karena EventSource tidak dapat menyetel header."
          schema:
            type: string
      security:
        - QueueTokenCookie: []
        - QueueTokenHeader: []
      responses:
        "200":
          description: SSE stream opened successfully
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                initial_snapshot:
                  summary: Snapshot awal (dikirim segera saat connect)
                  value: |
                    id: 31600
                    data: {"nowServing":31600,"state":"OPEN","ratePerMin":318,"paused":false,"serverTime":"2026-10-24T13:10:00.412Z"}

                position_update:
                  summary: Update posisi (default event)
                  value: |
                    data: {"nowServing":31604,"state":"OPEN","ratePerMin":318,"paused":false,"serverTime":"2026-10-24T13:10:01.004Z"}

                grant:
                  summary: Giliran tiba — klien panggil GET /queue/me
                  value: |
                    event: grant
                    data: {}

                sold_out:
                  summary: Tiket habis — klien WAJIB es.close()
                  value: |
                    event: sold-out
                    data: {"message":"Tiket sudah habis"}

                status_stale:
                  summary: Redis connection lost
                  value: |
                    event: status
                    data: {"stale":true}

                keepalive:
                  summary: Keepalive comment (15 detik)
                  value: |
                    : keepalive

        "401":
          description: Queue token invalid atau tidak ada
        "409":
          description: Sale belum dibuka (state SCHEDULED)
        "410":
          description: Event sold out — EventSource berhenti permanen, tidak reconnect

  /events/{event_id}/queue/me:
    get:
      tags: [Queue]
      summary: Get Queue State (Re-entrancy)
      operationId: getQueueMe
      description: |
        Satu-satunya endpoint yang dipanggil klien saat kembali — setelah refresh, ganti tab,
        atau kembali dari aplikasi bank. Mengembalikan token yang sama selama TTL belum habis.

        Juga dipanggil setelah menerima event `grant` dari SSE untuk mengambil `grant_token`.

        `state` yang dikembalikan:

        | State | Halaman tujuan |
        |---|---|
        | `QUEUED` | Waiting Room (lanjutkan SSE) |
        | `GRANTED` | Detail Ticket (countdown mulai) |
        | `SELECTING` | Detail Ticket (countdown dilanjutkan) |
        | `AWAITING_PAYMENT` | Payment Page (countdown dilanjutkan) |
        | `CONFIRMED` | Halaman tiket |
        | `EXPIRED` | Layar expired |

        **Requirement**: FR-08, FR-10, BR-09, NFR-02, NFR-07
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: string
          example: evt_konser_a
      security:
        - QueueTokenCookie: []
        - QueueTokenHeader: []
        - BearerAuth: []
      responses:
        "200":
          description: Current queue/booking state for re-entrancy
          content:
            application/json:
              examples:
                queued:
                  summary: Masih mengantre
                  value:
                    meta:
                      code: 200
                      message: Success
                    data:
                      state: QUEUED
                      ticket_no: 31842
                      now_serving: 31600
                granted:
                  summary: Giliran tiba — grant_token tersedia
                  value:
                    meta:
                      code: 200
                      message: Success
                    data:
                      state: GRANTED
                      grant_token: gt_abc123
                      booking_expires_at: "2026-10-23T13:15:00Z"
                      server_time: "2026-10-23T13:10:00Z"
                selecting:
                  summary: Sedang memilih tiket
                  value:
                    meta:
                      code: 200
                      message: Success
                    data:
                      state: SELECTING
                      grant_token: gt_abc123
                      booking_id: RB-00912
                      booking_expires_at: "2026-10-23T13:15:00Z"
                      server_time: "2026-10-23T13:10:00Z"
                awaiting_payment:
                  summary: Menunggu pembayaran
                  value:
                    meta:
                      code: 200
                      message: Success
                    data:
                      state: AWAITING_PAYMENT
                      grant_token: gt_abc123
                      booking_id: RB-00912
                      payment_expires_at: "2026-10-23T13:25:00Z"
                      payment_ref: pay_123
                      server_time: "2026-10-23T13:10:00Z"
                confirmed:
                  summary: Booking terkonfirmasi
                  value:
                    meta:
                      code: 200
                      message: Success
                    data:
                      state: CONFIRMED
                      booking_id: RB-00912
                expired:
                  summary: Token kadaluarsa
                  value:
                    meta:
                      code: 200
                      message: Success
                    data:
                      state: EXPIRED
        "401":
          description: Queue token tidak valid atau tidak ada

  /events/{event_id}/queue/serving:
    get:
      tags: [Queue]
      summary: Get Now Serving (Polling Fallback)
      operationId: getNowServing
      description: |
        Fallback polling — dipakai untuk hidrasi awal, jaringan yang memblokir `text/event-stream`,
        atau degraded mode saat tier SSE tidak sehat. **Bukan transport utama.**

        `poll_after_ms` ditentukan server berdasarkan posisi:
        - `>1000` → 10.000 ms
        - `101–1000` → 5.000 ms
        - `11–100` → 2.000 ms
        - `1–10` → 1.000 ms

        Klien tidak menanam interval sendiri.
        **Requirement**: FR-07 (fallback), NFR-08
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: string
          example: evt_konser_a
      responses:
        "200":
          description: Current now_serving with server-suggested poll interval
          content:
            application/json:
              example:
                meta:
                  code: 200
                  message: Success
                data:
                  now_serving: 31600
                  rate_per_min: 318
                  paused: false
                  server_time: "2026-10-24T13:10:00.412Z"
                  poll_after_ms: 5000

  # ──────────────────────────────────────────────
  #  BOOKING — TICKET SELECTION
  # ──────────────────────────────────────────────

  /events/{event_id}/tickets:
    get:
      tags: [Booking]
      summary: Get Ticket Selection Page
      operationId: getTicketSelection
      description: |
        Menampilkan kategori tiket dengan stok terkini. UI: "Pilih tempatmu di konser."
        Dipanggil setelah klien mendapat `grant_token` dari `GET /queue/me`.
        **Requirement**: FR-11, FR-12, FR-13, FR-17, BR-01, BR-02
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: string
          example: evt_konser_a
        - name: X-Device-Id
          in: header
          required: false
          description: >
            Pengikatan device untuk grant anonim — WAJIB bila pemanggil tidak login (OpenAPI
            tidak dapat menyatakan kewajiban bersyarat). Tidak cocok → 401 DEVICE_MISMATCH.
          schema:
            type: string
      security:
        - GrantToken: []
      responses:
        "200":
          description: Ticket categories with availability and session TTL
          content:
            application/json:
              example:
                meta:
                  code: 200
                  message: Success
                data:
                  event:
                    id: evt_konser_a
                    name: Konser A — Jakarta
                    date: "2026-12-25"
