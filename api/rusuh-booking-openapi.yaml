  /bookings/{booking_id}:
    get:
      tags:
      - Booking
      summary: Get Booking Detail
      operationId: getBooking
      description: |-
        Booking detail.

        Saat PAID, tickets[].eticket_url sudah membawa ?t= (token e-tiket), sehingga Success Page dapat membuka e-tiket tanpa akun dan tanpa email (NFR-10). Menggantikan GET /bookings/{id}/tickets (dihapus, ADR-006 §8.8).

        v2.13: summary.price_per_ticket dan paid_at dihapus; payment_method masuk skema. status: SELECTING / PENDING_PAYMENT / PAID / EXPIRED. 404 NOT_FOUND bila booking_id bukan milik grant ini (tidak dibedakan dari tidak ada).

        v2.20: Authorization: Bearer wajib bila grant milik akun login (401 UNAUTHORIZED / TOKEN_EXPIRED / TOKEN_INVALID).

        v2.23: booking yang sudah berakhir biasanya menjawab 401 GRANT_TOKEN_INVALID (sweep menghapus grant), bukan data.status EXPIRED; klien memanggil GET /queue/me.

        v2.25: di WebView pembayaran, X-Payment-Session menggantikan X-Grant-Token (+ X-Device-Id / Authorization). Lihat api-contracts §5 dan ADR-007.
      parameters:
      - name: booking_id
        in: path
        required: true
        schema:
          type: string
        example: RB-00912
      - name: X-Grant-Token
        in: header
        required: false
        description: Grant slot dari GET /queue/me. Wajib — ini yang menjaga endpoint ini. Wajib, KECUALI di WebView pembayaran
          yang mengirim X-Payment-Session sebagai gantinya (v2.25, ADR-007).
        schema:
          type: string
        example: gt_abc123
      - name: X-Device-Id
        in: header
        required: false
        description: Pengikatan device untuk grant anonim — WAJIB bila pemanggil tidak login. Acak 128 bit dari klien; server
          menyimpan HMAC-nya. Tidak cocok → 401 DEVICE_MISMATCH.
        schema:
          type: string
        example: d3f1a9c4b70e42f88a1c5e6072b9d4af
      - name: Authorization
        in: header
        required: false
        description: Bearer access token akun. WAJIB bila grant milik akun login (harus akun yang sama dengan grant); tamu
          tidak mengirimnya. Hilang/akun lain → 401 UNAUTHORIZED, kedaluwarsa → 401 TOKEN_EXPIRED, tidak sah → 401 TOKEN_INVALID
        schema:
          type: string
        example: Bearer eyJhbGciOi…
      - name: X-Payment-Session
        in: header
        required: false
        description: 'Hanya di WebView pembayaran (ADR-007): payment_session dari POST /payments/handoff/exchange, PENGGANTI
          X-Grant-Token + X-Device-Id + Authorization. Dikirim bersama X-Grant-Token → 400 VALIDATION_ERROR; X-Device-Id /
          Authorization yang ikut terkirim diabaikan. Tidak dikenal / grant sudah dihapus → 401 PAYMENT_SESSION_INVALID; booking
          lain → 404 NOT_FOUND.'
        schema:
          type: string
        example: ps_bTN4V1pLc0c2cWJ2Tk5yUjhYa0ZqZEw3a1R1aEVwWg
      responses:
        '200':
          description: Booking detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    type: object
                    properties:
                      code:
                        type: integer
                        example: 200
                      message:
                        type: string
                        example: Success
                      server_time:
                        type: string
                        format: date-time
                        example: '2026-11-03T09:12:00.412Z'
                        description: Jam server, ada di SETIAP respons; klien menyinkronkan jamnya dari sini (BR-10)
                  data:
                    type: object
                    properties:
                      booking_id:
                        type: string
                        example: RB-00912
                      status:
                        type: string
                        example: PENDING_PAYMENT
                        enum:
                        - SELECTING
                        - PENDING_PAYMENT
                        - PAID
                        - EXPIRED
                        description: SELECTING (GRANTED, SELECTING) · PENDING_PAYMENT (HELD, AWAITING_PAYMENT, PENDING_CANCELLATION)
                          · PAID (CONFIRMED) · EXPIRED (EXPIRED, LAPSED, ABANDONED)
                      event:
                        type: object
                        properties:
                          id:
                            type: string
                            example: evt_konser_a
                          name:
                            type: string
                            example: Konser A
                          date:
                            type: string
                            example: '2026-12-25'
                          venue:
                            type: string
                            example: GBK, Jakarta
                          image_url:
                            type: string
                            example: https://cdn.rusuh.id/events/konser-a.jpg
                      tickets:
                        type: array
                        items:
                          type: object
                          properties:
                            ticket_id:
                              type: string
                              example: TKT-001
                              description: Hanya saat PAID, setelah tiket diterbitkan (beberapa detik pertama PAID bisa tanpa
                                ini; klien mengulang)
                            category:
                              type: string
                              example: VIP
                            price:
                              type: integer
                              example: 1500000
                            nik_masked:
                              type: string
                              example: 3171**********22
                            eticket_url:
                              type: string
                              example: /tickets/TKT-001/eticket?t=et_9f3a2c
                              description: 'Hanya saat PAID, untuk tiket VALID/USED. Membawa ?t={eticket_token} (HMAC, satu
                                tiket, berlaku s.d. 00:00 WIB sehari setelah event): dapat dibuka tanpa akun dan tanpa email
                                (NFR-10)'
                        description: Satu per kursi, urutan pilihan customer; [] sebelum HELD (tidak pernah null)
                      summary:
                        type: object
                        properties:
                          quantity:
                            type: integer
                            example: 1
                          total:
                            type: integer
                            example: 1500000
                        description: 'Jumlah kursi dan jumlah harganya. price_per_ticket dihapus (v2.13): harga tiap kursi
                          ada di tickets[].price'
                      payment_ttl:
                        type: object
                        properties:
                          expires_at:
                            type: string
                            example: '2026-10-23T13:25:00Z'
                          server_time:
                            type: string
                            example: '2026-10-23T13:19:18Z'
                        description: Hanya saat PENDING_PAYMENT; selama grace PENDING_CANCELLATION expires_at sudah lewat
                          tetapi pembayaran masih bisa masuk
                      payment_method:
                        type: string
                        example: Virtual Account
                        description: 'Hanya saat PAID. Label: Virtual Account (bank_transfer), GoPay (gopay); metode lain
                          apa adanya'
              examples:
                Pending payment:
                  value:
                    meta:
                      code: 200
                      message: Success
                      server_time: '2026-11-03T09:12:00.412Z'
                    data:
                      booking_id: RB-00912
                      status: PENDING_PAYMENT
                      event:
                        id: evt_konser_a
                        name: Konser A
                        date: '2026-12-25'
                        venue: GBK, Jakarta
                        image_url: https://cdn.rusuh.id/events/konser-a.jpg
                      tickets:
                      - category: VIP
                        price: 1500000
                        nik_masked: 3171**********22
                      summary:
                        quantity: 1
                        total: 1500000
                      payment_ttl:
                        expires_at: '2026-10-23T13:25:00Z'
                        server_time: '2026-10-23T13:19:18Z'
                Paid:
                  value:
                    meta:
                      code: 200
                      message: Success
                      server_time: '2026-11-03T09:12:00.412Z'
                    data:
                      booking_id: RB-00912
                      status: PAID
                      event:
                        id: evt_konser_a
                        name: Konser A
                        date: '2026-12-25'
                        venue: GBK, Jakarta
                        image_url: https://cdn.rusuh.id/events/konser-a.jpg
                      tickets:
                      - ticket_id: TKT-001
                        category: VIP
                        price: 1500000
                        nik_masked: 3171**********22
                        eticket_url: /tickets/TKT-001/eticket?t=et_9f3a2c
                      summary:
                        quantity: 1
                        total: 1500000
                      payment_method: Virtual Account
                Paid — ticket still being issued:
                  value:
                    meta:
                      code: 200
                      message: Success
                      server_time: '2026-11-03T09:12:00.412Z'
                    data:
                      booking_id: RB-00912
                      status: PAID
                      event:
                        id: evt_konser_a
                        name: Konser A
                        date: '2026-12-25'
                        venue: GBK, Jakarta
                        image_url: https://cdn.rusuh.id/events/konser-a.jpg
                      tickets:
                      - category: VIP
                        price: 1500000
                        nik_masked: 3171**********22
                      summary:
                        quantity: 1
                        total: 1500000
                      payment_method: Virtual Account
        '400':
          description: |-
            - DEVICE_ID_REQUIRED — Bad Request
            - VALIDATION_ERROR — VALIDATION_ERROR
          content:
            application/json:
              schema:
                oneOf:
                - title: DEVICE_ID_REQUIRED
