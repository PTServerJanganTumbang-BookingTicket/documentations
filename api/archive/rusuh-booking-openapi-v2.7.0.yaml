                      description: Scan QR atau buka aplikasi GoPay.
                      icon_url: https://cdn.rusuh.id/icons/ewallet.svg
                      enabled: true

  /payments/{booking_id}:
    post:
      tags: [Payment]
      summary: Initiate Payment
      operationId: initiatePayment
      description: |
        Memulai pembayaran dengan metode terpilih. UI: tombol "Bayar Sekarang".

        **Idempoten**: klik ganda menghasilkan satu charge dan dua respons identik. Tidak ada charge kedua.

        **Custom expiry** dikirim ke Midtrans agar jendela Midtrans dan sistem kita berakhir pada detik yang sama (`custom_expiry.order_time = held_at`).

        **Setelah penolakan (deny)**: panggil endpoint ini langsung dengan metode baru — jangan panggil `/retry`. Jalur `deny` sudah menaikkan `payment_attempts` sendiri.

        Desktop: gunakan `qr_url` untuk GoPay. Mobile: gunakan `deeplink_url`.
        **Requirement**: FR-20, FR-21, FR-24, FR-25
      parameters:
        - name: booking_id
          in: path
          required: true
          schema:
            type: string
          example: RB-00912
        - name: X-Device-Id
          in: header
          required: false
          description: >
            Pengikatan device untuk grant anonim — WAJIB bila pemanggil tidak login (OpenAPI
            tidak dapat menyatakan kewajiban bersyarat). Tidak cocok → 401 DEVICE_MISMATCH.
          schema:
            type: string
      security:
        - GrantToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method]
              properties:
                method:
                  type: string
                  enum: [bank_transfer, gopay]
                bank:
                  type: string
                  enum: [bca, bni, bri, cimb]
                  description: Wajib bila method = bank_transfer
            examples:
              bank_transfer:
                summary: Bank Transfer — Virtual Account
                value:
                  method: bank_transfer
                  bank: bca
              gopay:
                summary: GoPay / QRIS
                value:
                  method: gopay
      responses:
        "200":
          description: Payment initiated (or already initiated — idempotent)
          content:
            application/json:
              examples:
                bank_transfer:
                  summary: VA BCA
                  value:
                    meta:
                      code: 200
                      message: Payment initiated
                    data:
                      payment_id: RB-00912:1
                      method: bank_transfer
                      status: PENDING
                      instructions:
                        bank: bca
                        va_number: "8801234567890"
                      ttl:
                        expires_at: "2026-10-25T10:25:00Z"
                        ttl_seconds: 540
                        server_time: "2026-10-25T10:16:00Z"
                gopay:
                  summary: GoPay QR + deeplink
                  value:
                    meta:
                      code: 200
                      message: Payment initiated
                    data:
                      payment_id: RB-00912:1
                      method: gopay
                      status: PENDING
                      instructions:
                        qr_url: https://api.midtrans.com/v2/gopay/.../qr-code
                        deeplink_url: https://gojek.link/...
                      ttl:
                        expires_at: "2026-10-25T10:25:00Z"
                        ttl_seconds: 540
                        server_time: "2026-10-25T10:16:00Z"
        "409":
          description: Status booking tidak sesuai (bukan HELD atau sudah terminal)
        "503":
          description: Circuit breaker payment gateway terbuka (PAYMENT_GATEWAY_UNAVAILABLE). Booking tetap HELD; boleh di-retry selama tenggat pembayaran belum lewat. Menggantikan ADMISSION_PAUSED (v2.7, pause dihapus)

  /payments/{booking_id}/retry:
    post:
      tags: [Payment]
      summary: Cancel & Switch Payment Method
      operationId: retryPayment
      description: |
        Dipanggil **hanya** ketika pembayaran sebelumnya masih `pending` dan customer ingin berganti metode.

        **JANGAN panggil setelah pembayaran ditolak (deny)** — cukup panggil `POST /payments/{booking_id}` langsung dengan metode baru.

        **JANGAN panggil** saat customer masih memilih di UI sebelum menekan "Bayar Sekarang" — belum ada transaksi Midtrans.

        TTL tidak di-reset: `payment_expires_at` tetap dihitung dari `held_at`.
        Setelah endpoint ini sukses, klien memanggil `POST /payments/{booking_id}` dengan metode baru.
        **Requirement**: FR-20, NFR-02
      parameters:
        - name: booking_id
          in: path
          required: true
          schema:
            type: string
          example: RB-00912
        - name: X-Device-Id
          in: header
          required: false
          description: >
            Pengikatan device untuk grant anonim — WAJIB bila pemanggil tidak login (OpenAPI
            tidak dapat menyatakan kewajiban bersyarat). Tidak cocok → 401 DEVICE_MISMATCH.
          schema:
            type: string
      security:
        - GrantToken: []
      responses:
        "200":
          description: Previous payment cancelled, booking returned to HELD
          content:
            application/json:
              example:
                meta:
                  code: 200
                  message: Previous payment cancelled
                data:
                  booking_id: RB-00912
                  status: HELD
                  attempt: 2
                  cancelled_order_id: RB-00912:1
                  payment_expires_at: "2026-10-25T10:25:00Z"
                  server_time: "2026-10-25T10:23:10Z"
        "404":
          description: Booking tidak ditemukan atau bukan milik token ini (404 juga untuk 403 — jangan bocorkan eksistensi)
        "409":
          description: |
            Berbagai kondisi konflik:
            - `PAYMENT_ALREADY_SETTLED` — pembayaran sudah lunas, webhook akan mengonfirmasi
            - Status mismatch — booking tidak dalam `AWAITING_PAYMENT`
            - `PAYMENT_WINDOW_CLOSED` — TTL sudah lewat atau sisa waktu di bawah minimum
        "429":
          description: MAX_ATTEMPTS_EXCEEDED
        "503":
          description: Midtrans tidak tersedia — `payment_attempts` TIDAK dinaikkan, VA lama masih berlaku

  /payments/{booking_id}/status:
    get:
      tags: [Payment]
      summary: Get Payment Status
      operationId: getPaymentStatus
      description: |
        Polling status pembayaran. UI: Payment Page polling (setiap 2 detik).

        **Satu-satunya sinyal bahwa pembayaran gagal** untuk customer. Tanpa endpoint ini customer menatap countdown tanpa tahu kartunya ditolak.

        Saat menerima `FAILED`: kembali ke daftar metode, **tanpa memanggil `/retry`** — jalur deny sudah menaikkan `payment_attempts`.

        `PENDING_CANCELLATION` ditampilkan sebagai `PENDING` — "memverifikasi pembayaran…", bukan layar expired.
        **Requirement**: FR-22, FR-23
      parameters:
        - name: booking_id
          in: path
          required: true
          schema:
            type: string
          example: RB-00912
        - name: X-Device-Id
          in: header
          required: false
          description: >
            Pengikatan device untuk grant anonim — WAJIB bila pemanggil tidak login (OpenAPI
            tidak dapat menyatakan kewajiban bersyarat). Tidak cocok → 401 DEVICE_MISMATCH.
          schema:
            type: string
      security:
        - GrantToken: []
      responses:
        "200":
          description: Payment status — selalu 200 terlepas dari hasil pembayaran
          content:
            application/json:
              examples:
                pending:
                  summary: Menunggu pembayaran
                  value:
                    meta:
                      code: 200
                      message: Payment pending
                    data:
                      status: PENDING
                      server_time: "2026-10-23T13:22:00Z"
                      ttl_seconds: 180
                paid:
                  summary: Pembayaran sukses
                  value:
                    meta:
                      code: 200
                      message: Payment successful
                    data:
                      status: PAID
                      paid_at: "2026-10-23T13:23:00Z"
                      redirect_url: /bookings/RB-00912/success
                expired:
                  summary: Pembayaran kadaluarsa
                  value:
                    meta:
                      code: 200
                      message: Payment expired
                    data:
                      status: EXPIRED
                      expired_at: "2026-10-23T13:25:00Z"
                failed:
                  summary: Pembayaran gagal — stok masih dipegang customer
                  value:
                    meta:
                      code: 200
                      message: Payment failed
                    data:
                      status: FAILED
                      reason: Pembayaran ditolak penyedia
                      can_retry: true
                      attempt: 2
                      payment_expires_at: "2026-10-25T10:25:00Z"
                      server_time: "2026-10-25T10:19:40Z"

  /payments/webhook:
    post:
      tags: [Payment]
      summary: Payment Gateway Webhook
      operationId: paymentWebhook
      description: |
        Callback dari payment gateway (Midtrans). **Endpoint internal — tidak dipanggil klien.**

        Dilindungi oleh **resource policy API Gateway** (allowlist IP gateway) + verifikasi HMAC.

        **TIDAK ADA HEADER TANDA TANGAN.** Midtrans tidak mengirim header tanda tangan apa pun
        pada HTTP notification Core API — tanda tangannya adalah field `signature_key` **di
        dalam body**. v2.4 mendeklarasikan `X-Callback-Signature` sebagai header wajib, dan
        implementasi yang mengikutinya menolak setiap notifikasi yang sah.

        **Verifikasi signature**: `SHA512(order_id + status_code + gross_amount + ServerKey)`
        Konkatenasi polos tanpa pemisah. Tidak cocok → abaikan notifikasi, tidak ada
        perubahan status, tetap jawab 200.

        `gross_amount` dipakai sebagai **string yang diterima**, termasuk desimalnya:
        `3000000` dan `"3000000.00"` menghasilkan dua hash berbeda dan hanya yang kedua cocok.

        **Idempoten — kunci DITURUNKAN**, karena Midtrans tidak mengirim ID event:
        ```
        gateway_event_id = order_id + ':' + transaction_status + ':' + status_code
        ```
        Disimpan dengan constraint UNIQUE; pengiriman ulang menjawab 200 tanpa diproses ulang.
        `transaction_id` sendirian TIDAK cukup — ia stabil sepanjang hidup satu transaksi,
        jadi `pending` dan `settlement` membawa nilai identik dan yang kedua akan ditelan.
        Satu baris per EVENT, bukan per booking.

        **Pemeriksaan kedua yang direkomendasikan Midtrans** (bandingkan dengan Get
        Transaction Status) sudah ada sebagai charge reconciler di `rusuh-admission-ctl`
        (tiap 5 menit, read-only), jadi webhook tidak memanggilnya inline.

        **Selalu menjawab 200** — termasuk pada duplikat.

        | `transaction_status` | `fraud_status` | Transisi |
        |---|---|---|
        | `settlement` | `accept` | → `CONFIRMED`, terbitkan tiket, kirim e-tiket |
        | `capture` | **`accept`** | → `CONFIRMED` |
        | `capture` | bukan `accept` | tetap `AWAITING_PAYMENT` — belum lunas |
        | `deny`/`cancel`/`failure` | — | → `HELD`, `payment_attempts` naik |
        | `expire` | — | → `EXPIRED`, lepas stok |
        | `pending` | — | tidak ada perubahan |

        `payment_type` webhook bisa berbeda dari yang dikirim (QRIS vs GoPay) — jangan dicocokkan.
        **Requirement**: FR-25, FR-22, FR-23, FR-26, NFR-07
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MidtransNotification"
            example:
              transaction_time: "2026-10-24 20:23:00"
              transaction_status: settlement
              transaction_id: 9f2a1c7b-4e1a-4c7d-9f3b-2a1c7b9f2a1c
              status_message: midtrans payment notification
              status_code: "200"
              signature_key: "fe5f725ea770c451…"
              settlement_time: "2026-10-24 20:23:05"
              payment_type: bank_transfer
              order_id: "RB-00912:1"
              merchant_id: G123456789
              gross_amount: "3000000.00"
              fraud_status: accept
              currency: IDR
              va_numbers:
                - bank: bca
                  va_number: "8801234567890"
      responses:
        "200":
          description: Callback processed (selalu 200, termasuk duplikat)
          content:
            application/json:
              example:
                meta:
                  code: 200
                  message: Callback processed
                data: {}

  # ──────────────────────────────────────────────
  #  TICKETS (Accounts › Tickets) — MY TICKETS
  # ──────────────────────────────────────────────

  /users/me/tickets:
    get:
      tags: [Tickets]
      summary: Get My Tickets
      operationId: getMyTickets
      description: |
        List tiket milik user yang sedang login. UI: "Tiket saya" menu.
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [upcoming, past, all]
          description: Filter berdasarkan status event
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of user's tickets
          content:
            application/json:
              example:
                meta:
                  code: 200
                  message: Success
                  pagination:
                    totalData: 1
                    totalPage: 1
                    limit: 10
                    offset: 0
                data:
                  - ticket_id: TKT-001
                    booking_id: RB-00912
                    event:
                      id: evt_konser_a
                      name: Konser A — Jakarta
                      date: "2026-12-25"
                      venue: GBK
                      image_url: https://cdn.rusuh.id/events/konser-a.jpg
                    category: VIP
                    price: 1500000
                    status: VALID
                    eticket_url: /tickets/TKT-001/eticket

  /tickets/{ticket_id}/eticket:
    get:
      tags: [Tickets]
      summary: Get E-Ticket
      operationId: getEticket
      description: |
        Download/view e-ticket dengan QR code. UI: "Lihat E-Tiket" button.

        QR code berisi `qr_value` yang diverifikasi petugas venue bersama identitas pemegang.
        **Nomor bangku tidak diimplementasikan di POC.**
        **Requirement**: FR-27
      parameters:
        - name: ticket_id
          in: path
          required: true
          schema:
            type: string
          example: TKT-001
        - name: t
          in: query
          required: false
          description: >
            Token e-tiket dari tautan email. Alternatif `Authorization` untuk pemegang NIK dan
            pembeli tamu, yang umumnya tidak punya akun.
          schema:
            type: string
      security:
        - BearerAuth: []
        - ETicketToken: []
      responses:
        "200":
          description: E-ticket with QR code
          content:
            application/json:
              example:
                meta:
                  code: 200
                  message: Success
                data:
                  ticket_id: TKT-001
                  event:
                    name: Konser A — Jakarta
                    date: "2026-12-25"
                    time: "19:00"
                    venue: GBK, Jakarta
                  category: VIP
                  holder:
                    nik_masked: "3171********xx22"
                  qr_code: data:image/png;base64,iVBORw0KGgo...
                  qr_value: TKT-001|evt_konser_a|3171xxxxxxxxxx22
                  instructions: Tunjukkan QR code dan identitas pemegang saat masuk venue.
        "401":
          description: Unauthorized
        "404":
          description: Tiket tidak ditemukan atau bukan milik token ini

  # ──────────────────────────────────────────────
  #  ADMIN
  # ──────────────────────────────────────────────

  /admin/reconciliation/disputed:
    get:
      tags: [Admin]
      summary: Disputed Payment Reconciliation
      operationId: getDisputedPayments
      description: |
        Booking yang menerima callback sukses **setelah** pembatalan final — pembayaran masuk setelah stok dijual ulang ke orang lain.

        Endpoint operasional — terpisah dari jalur customer. Tidak memakai grant token antrian.

        **Refund tidak dieksekusi otomatis di POC** — operator merekonsiliasi lewat dashboard Midtrans menggunakan `order_id` dan `gateway_event_id` di setiap baris.

        Sebelum produksi: otomatiskan lewat `POST /v2/{order_id}/refund`.
        **Requirement**: FR-25, NFR-09
      security:
        - BearerAuth: []
      parameters:
        - name: event_id
          in: query
          required: true
          schema:
            type: string
          example: evt_konser_a
      responses:
        "200":
          description: List of disputed payments requiring manual reconciliation
          content:
            application/json:
              example:
                meta:
                  code: 200
                  message: Success
                data:
                  disputed:
                    - booking_id: RB-00912
                      order_id: RB-00912:2
                      gateway_event_id: evt_9f2a1c7b
                      gross_amount: 1500000
                      payment_type: bank_transfer
                      paid_at: "2026-10-26T10:25:48Z"
                      cancelled_at: "2026-10-26T10:25:30Z"
                      contact_email: buyer@example.com
                      refund_status: PENDING_MANUAL
