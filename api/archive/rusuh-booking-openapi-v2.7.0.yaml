        Kartu kredit dan OTC dikecualikan karena tidak dapat menghormati TTL 10 menit.

        `enabled: false` saat circuit breaker payment gateway terbuka — UI menonaktifkan pilihan.
        **Requirement**: FR-20
      parameters:
        - name: booking_id
          in: path
          required: true
          schema:
            type: string
          example: RB-00912
        - name: X-Device-Id
          in: header
          required: false
          description: >
            Pengikatan device untuk grant anonim — WAJIB bila pemanggil tidak login (OpenAPI
            tidak dapat menyatakan kewajiban bersyarat). Tidak cocok → 401 DEVICE_MISMATCH.
          schema:
            type: string
      security:
        - GrantToken: []
      responses:
        "200":
          description: Available payment methods
