# ARCHIVED 2026-11-05 — NOT MAINTAINED.
# Source of truth for the API is now Apidog (`../rusuh-booking-apidog.json`) + `../api-contracts.md`.
# Kept for history (tender rule 5). GET /bookings/{booking_id}/tickets removed 2026-11-05 (ADR-006 §8.8). Last version: 2.7.0. Export a fresh OpenAPI from Apidog when a tool needs one.
openapi: 3.0.3
info:
  title: Rusuh Booking Tiket API
  version: "2.7.0"
  description: |
    API contracts untuk sistem penjualan tiket konser Rusuh dengan Virtual Waiting Room.

    Selaras dengan **ADR-005** (Keputusan Arsitektur Final — SSE + ECS Fargate).

    ### Dua Surface Berbeda
    | Surface | Host | Transport |
    |---|---|---|
    | REST API | `api.rusuhtiket.com` (API Gateway) | HTTP/JSON |
    | SSE Stream | `events.rusuhtiket.com` (ALB) | `text/event-stream` |

    ### Autentikasi

    Empat kredensial, empat slot transport. Tidak ada satu slot pun yang membawa lebih dari
    satu jenis — middleware memilih per rute, tidak mencoba memverifikasi tanda tangan lalu
    jatuh ke pencarian Redis. Sampai v2.2 ketiganya berbagi `Authorization: Bearer`.

    | Kredensial | Slot | Membuktikan |
    |---|---|---|
    | Access Token (sesi akun) | `Authorization: Bearer` | siapa pemegangnya |
    | Grant Token | `X-Grant-Token` | pemegangnya punya slot |
    | Queue Token (ruang tunggu) | cookie `queue_token` (web) / `X-Queue-Token` (mobile) | posisinya dalam antrian |
    | E-ticket Token | query `?t=` pada tautan email | hak baca satu tiket |

    Pengikatan tambahan, bukan slot kredensial: `X-Device-Id` mengikat grant **anonim** ke
    perangkat yang menerimanya. Acak 128 bit yang dibuat klien, disimpan server sebagai HMAC;
    bukan fingerprint pasif. Customer login tidak mengirimnya — `account_id` mengikat lebih kuat.

    - **Queue Token**: cookie `HttpOnly` `queue_token` (web) atau header `X-Queue-Token`
      (mobile). Web memakai cookie karena `EventSource` tidak dapat menyetel header request.
      Token TIDAK pernah dikirim via query string.
    - **Grant Token**: opaque (`gt_…`, bukan JWT), diperoleh setelah giliran tiba via
      `GET /queue/me`, dikirim sebagai `X-Grant-Token`. Menjaga seluruh endpoint booking dan
      payment. Tersimpan di Redis, sehingga dapat dicabut seketika — tidak seperti access
      token. Diterbitkan untuk tamu juga, karena tamu boleh membeli.
    - **Access Token**: JWT sesi akun, diperoleh setelah login via `GET /auth/verify` atau
      `POST /auth/refresh`.
      Dikirim sebagai `Authorization: Bearer {access_token}`. Berlaku **22740 detik**
      — angka yang sama dengan `GRANT_TOKEN_TTL_SECONDS`, diturunkan dari perjalanan
      customer (ADR-005 §7: 300 booking + 600 pembayaran + 30 grace + margin) sehingga
      sesi hidup lebih lama daripada journey. Karena token ini stateless, umurnya
      sekaligus jendela pencabutannya.
    - **Refresh Token**: opaque (bukan JWT), berlaku 30 hari, sekali pakai dengan
      rotasi. Ditukar di `POST /auth/refresh`. Server menyimpan hash-nya saja, dan
      pemutaran ulang token yang sudah terpakai mencabut seluruh keluarga token.

    ### Pola Respons
    Semua endpoint menggunakan envelope `{ meta, data }`.
    Field `server_time` hadir di setiap respons agar klien dapat menyinkronkan jam (BR-10).

    ### Status Antrian
    Setelah `POST /events/{id}/queue/join`, klien membuka SSE stream.
    Posisi dihitung klien: `position = ticket_no − nowServing`.
    Saat `nowServing ≥ ticket_no` (pada payload SSE mana pun, termasuk snapshot), klien memanggil
    `GET /events/{id}/queue/me` untuk mendapat `grant_token`. Tidak ada event `grant` (ADR-006 §4.2).

servers:
  - url: https://api.rusuh.id/v1
    description: Production

tags:
  - name: Authentication
    description: Magic link login, refresh sesi, dan registrasi akun
  - name: Accounts
    description: Manajemen NIK tersimpan (Daftar_NIK_Teman)
  - name: Tickets
    description: Tiket milik user dan e-ticket. Di Apidog berada di dalam folder Accounts (Accounts › Tickets)
  - name: Events
    description: Daftar dan detail event konser
  - name: Queue
    description: Virtual Waiting Room — join, stream SSE, status re-entrancy, polling fallback
  - name: Booking
    description: Pemilihan tiket dan pembuatan booking
  - name: NIK
    description: Validasi NIK ke Dukcapil
  - name: Payment
    description: Inisiasi pembayaran, status, webhook gateway
  - name: Admin
    description: Rekonsiliasi operasional (bukan jalur customer)

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Access token JWT **sesi akun**, diterbitkan `GET /auth/verify` atau
        `POST /auth/refresh`. Ini satu-satunya kredensial yang pernah menempati slot
        `Authorization`. Ia TIDAK dikirim ke endpoint booking/payment sama sekali: sejak v2.4
        `bookings.account_id` diambil dari keterlibatan pada INSERT saat GRANT, bukan dari
        kredensial yang dibawa klien saat checkout.
    GrantToken:
      type: apiKey
      in: header
      name: X-Grant-Token
      description: >
        Grant slot opaque (`gt_…`), diperoleh dari `GET /events/{event_id}/queue/me` saat
        `nowServing ≥ ticket_no` (atau langsung dari join bila antrian kosong). Membuktikan pemegangnya punya slot, bukan siapa dirinya — tamu
        mendapatkannya juga. Wajib pada seluruh endpoint booking dan payment. Tersimpan di
        `grant:{token} EX GRANT_TOKEN_TTL_SECONDS`, jadi setiap verifikasi membacanya dari
        Redis dan satu `DEL` mencabutnya.
    QueueTokenCookie:
      type: apiKey
      in: cookie
      name: queue_token
      description: >
        Cookie HttpOnly yang di-set server saat `POST /queue/join`, membuktikan posisi dalam
        antrian. Dipakai web, termasuk oleh SSE stream — `EventSource` tidak dapat menyetel
        header request. Klien mobile memakai `X-Queue-Token`.
        `Max-Age` adalah batas atas: keadaan terminal menghapus kredensialnya lebih cepat, dan
        `CONFIRMED` menggantinya dengan nisan yang tidak memulihkan apa pun.
    ETicketToken:
      type: apiKey
      in: query
      name: t
      description: >
        HMAC bertanda tangan atas satu `ticket_id` + kedaluwarsa, dikirim pada tautan di email
        e-tiket. Tanpa identitas akun, lingkup satu tiket, berlaku sampai tanggal event + 1
        hari. Ada karena FR-26 mengirim tiket ke masing-masing pemegang NIK, dan pemegang NIK
        umumnya tidak punya akun — rute yang hanya menerima sesi akun membuat tombol di email
        mereka menjawab 401.
    QueueTokenHeader:
      type: apiKey
      in: header
      name: X-Queue-Token
      description: >
        Token ruang tunggu yang sama, untuk klien mobile yang tidak punya cookie store.
        Bukan `Authorization`: slot itu milik sesi akun.

  schemas:
    Meta:
      type: object
      required: [code, message, server_time]
      properties:
        code:
          type: integer
          example: 200
        message:
          type: string
          example: Success
        server_time:
          type: string
          format: date-time
          example: "2026-11-03T09:12:00.412Z"
          description: >
            Jam server, pada SETIAP respons — sukses maupun error (BR-10). Klien menghitung
            offset = server_time - jam lokal sekali, lalu merender semua hitung mundur
            terhadap offset itu; jam perangkat tidak pernah dipercaya langsung. Tidak ada
            GET /time. Diisi di layer respons bersama, bukan oleh handler.
            Contoh per endpoint di file ini menghilangkannya demi keringkasan — ia tetap
            selalu ada.

    SaleState:
      type: string
      enum: [SCHEDULED, OPEN, SOLD_OUT, CLOSED]
      description: >
        State sale (`queue:{ev}:state`). SOLD_OUT reversibel (stok dapat kembali dari booking
        yang kedaluwarsa); CLOSED final, disetel SOLD_OUT_HOLD_SECONDS (930 detik) setelah sold_out_at.
      example: OPEN

    QueueJoinData:
      type: object
      description: >
        `data` respons POST /queue/join. Bentuk antre (ticket_no, position, queue_token) atau
        bentuk antrian kosong (granted, grant_token). Estimasi waktu tunggu TIDAK dikirim:
        frontend menghitungnya dari ratePerMin (api-contracts §3.5).
      properties:
        ticket_no:
          type: integer
          example: 32748
        now_serving:
          type: integer
          example: 31500
        position:
          type: integer
          description: ticket_no − now_serving. ≤ 0 berarti giliran tiba (panggil /queue/me).
          example: 1248
        queue_token:
          type: string
          description: >
            Token ruang tunggu. Mobile menyimpannya di secure store dan mengirimnya sebagai
            X-Queue-Token. Web mengabaikannya dan memakai cookie HttpOnly queue_token (jangan
            simpan di localStorage).
          example: qt_xyz789
        sse_url:
          type: string
          example: /queue/stream
        rejoined:
          type: boolean
          description: true bila keterlibatan yang ada dipulihkan (BR-07 / BR-09).
        state:
          type: string
          description: Hanya pada rejoined. Keadaan engagement (§3.3); bila bukan QUEUED, rutekan sesuai state.
          example: QUEUED
        event:
          type: object
          properties:
            id: { type: string, example: evt_konser_a }
            name: { type: string, example: Konser A — Jakarta }
        granted:
          type: boolean
          description: true bila antrian kosong dan admission-ctl memberi grant dalam ≤ 1 detik (FR-05).
        grant_token:
          type: string
          description: Hanya bila granted. Dikirim sebagai X-Grant-Token ke endpoint booking dan payment.
          example: gt_abc123
        booking_expires_at:
          type: string
          format: date-time

    QueueStateData:
      type: object
      required: [state]
      description: "`data` respons GET /queue/me. Field yang ada bergantung pada `state`."
      properties:
        state:
          type: string
          enum: [QUEUED, GRANTED, SELECTING, AWAITING_PAYMENT, CONFIRMED, EXPIRED]
        ticket_no:
          type: integer
          description: Hanya QUEUED.
        now_serving:
          type: integer
          description: Hanya QUEUED. ticket_no ≤ now_serving = grant pending ("sebentar lagi"); ulangi setelah 1 detik.
        grant_token:
          type: string
          description: GRANTED, SELECTING, AWAITING_PAYMENT. Dikirim sebagai X-Grant-Token.
        booking_id:
          type: string
        booking_expires_at:
          type: string
          format: date-time
        payment_expires_at:
          type: string
          format: date-time
        payment_ref:
          type: string
        server_time:
          type: string
          format: date-time

    NowServingData:
      type: object
      required: [now_serving, rate_per_min, state, server_time, poll_after_ms, poll_tiers]
      properties:
        now_serving:
          type: integer
          example: 31600
        rate_per_min:
          type: integer
          description: Nomor yang dilewati now_serving per menit. Frontend memakai rumus estimasi api-contracts §3.5.
          example: 318
        state:
          $ref: "#/components/schemas/SaleState"
        server_time:
          type: string
          format: date-time
        poll_after_ms:
          type: integer
          description: Default bila posisi tidak diketahui.
          example: 1000
        poll_tiers:
          type: array
          description: Tabel interval milik server; klien memilih baris pertama dengan max_position ≥ posisinya (null = tak terbatas).
          items:
            type: object
            required: [max_position, poll_after_ms]
            properties:
              max_position:
                type: integer
                nullable: true
              poll_after_ms:
                type: integer

    QueueStreamUpdate:
      type: object
      required: [nowServing, state, ratePerMin, serverTime]
      description: >
        SSE event default (tanpa nama): snapshot saat connect, tiap nowServing berubah, dan
        heartbeat 10 detik. Byte identik untuk semua koneksi event. Baris `id:` = nowServing.
      properties:
        nowServing:
          type: integer
          example: 31604
        state:
          $ref: "#/components/schemas/SaleState"
        ratePerMin:
          type: integer
          description: Nomor yang dilewati nowServing per menit (60 detik terakhir selama OPEN). Untuk estimasi di frontend.
          example: 318
        serverTime:
          type: string
          format: date-time
          example: "2026-10-24T13:10:01.004Z"

    QueueStreamStatus:
      type: object
      required: [state, serverTime]
      description: >
        SSE `event: status`: dikirim sekali pada tiap transisi state (OPEN → SOLD_OUT,
        SOLD_OUT → OPEN, → CLOSED). Pada SOLD_OUT klien tetap tersambung; pada CLOSED event
        sold-out menyusul.
      properties:
        state:
          $ref: "#/components/schemas/SaleState"
        soldOutAt:
          type: string
          format: date-time
          nullable: true
          description: Hanya pada SOLD_OUT.
        serverTime:
          type: string
          format: date-time

    QueueStreamStale:
      type: object
      required: [stale]
      description: >
        SSE `event: stale`: data antrian berhenti segar (dulu event `status`). Hanya pada
        transisi. Klien meredupkan angka dan menampilkan "Memperbarui…", TIDAK reconnect sendiri.
      properties:
        stale:
          type: boolean
        reason:
          type: string
          enum: [redis_disconnected, no_admission_updates]

    QueueStreamSoldOut:
      type: object
      required: [message]
      description: "SSE `event: sold-out`, setelah status CLOSED. Klien WAJIB es.close()."
      properties:
        message:
          type: string
          example: Tiket sudah habis

    MetaPagination:
      allOf:
        - $ref: "#/components/schemas/Meta"
        - type: object
          properties:
            pagination:
              type: object
              properties:
                totalData:
                  type: integer
                totalPage:
                  type: integer
                limit:
                  type: integer
                offset:
                  type: integer

    ErrorResponse:
      type: object
      properties:
        meta:
          $ref: "#/components/schemas/Meta"
        data:
          type: object

    EventDisplay:
      type: object
      description: Keputusan server untuk rendering tombol — klien tidak menghitung ulang logika ini.
      properties:
        enabled:
          type: boolean
        action:
          type: string
          enum: [JOIN_QUEUE, GO_TO_TICKETS, NONE]
        label_key:
          type: string
          enum: [sold_out, sold_out_may_return, coming_soon, queue_full, buy_now, join_queue]
          description: >
            sold_out dipakai hanya bila state internal sudah CLOSED; selama SOLD_OUT masih
            reversibel (stok dapat kembali dari booking kedaluwarsa) label-nya
            sold_out_may_return. Keduanya enabled=false action=NONE.
        badge_key:
          type: string
          nullable: true
          enum: [selling_out_fast]

    TicketCategory:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        price:
          type: integer
        available:
          type: integer
        status:
          type: string
          enum: [AVAILABLE, SOLD_OUT]

    Captcha:
      type: object
      description: >
        Parameter widget CAPTCHA tak terlihat. Klien memuat widget pada halaman detail event
        — termasuk saat queue_state NOT_OPEN — dan menyegarkan tokennya tiap ~60 detik,
        sehingga pada sale_starts_at ia sudah memegang token segar untuk dibawa ke
        POST /events/{event_id}/queue/join. site_key bersifat publik; secret key tidak
        pernah dikirim ke klien.
      properties:
        provider:
          type: string
          example: turnstile
        site_key:
          type: string
          example: "0x4AAAAAAA..."

    MidtransNotification:
      type: object
      description: >
        Body HTTP notification Midtrans Core API. Midtrans TIDAK mengirim header tanda tangan
        apa pun — tanda tangannya adalah field signature_key di dalam body ini.
      required: [order_id, status_code, gross_amount, signature_key, transaction_status]
      properties:
        order_id:
          type: string
          description: "{booking_id}:{payment_attempts} — diturunkan server, tidak pernah dari klien."
          example: "RB-00912:1"
        transaction_status:
          type: string
          enum: [capture, settlement, pending, deny, cancel, expire, failure, refund, partial_refund, chargeback]
          example: settlement
        fraud_status:
          type: string
          enum: [accept, challenge, deny]
          description: >
            Wajib diperiksa untuk capture. capture dengan fraud_status selain accept BUKAN
            lunas — dana belum diterima, jangan terbitkan tiket.
          example: accept
        status_code:
          type: string
          example: "200"
        gross_amount:
          type: string
          description: >
            String BERDESIMAL, bukan integer. Masuk formula tanda tangan APA ADANYA —
            menormalkannya lebih dulu menghasilkan hash yang tidak pernah cocok.
          example: "3000000.00"
        signature_key:
          type: string
          description: SHA512(order_id + status_code + gross_amount + ServerKey), konkatenasi polos tanpa pemisah.
        transaction_id:
          type: string
          description: >
            Stabil sepanjang hidup satu transaksi — pending dan settlement membawa nilai
            identik. Karena itu ia TIDAK dapat menjadi kunci idempotency sendirian.
          example: 9f2a1c7b-4e1a-4c7d-9f3b-2a1c7b9f2a1c
        transaction_time:
          type: string
          description: "Format YYYY-MM-DD HH:mm:ss, waktu WIB TANPA penanda zona. Bukan ISO-8601."
          example: "2026-10-24 20:23:00"
        settlement_time:
          type: string
          example: "2026-10-24 20:23:05"
        payment_type:
          type: string
          description: >
            BOLEH berbeda dari yang dikirim saat charge: pembayaran QR GoPay lewat aplikasi
            QRIS lain datang sebagai qris. Dicatat, TIDAK dicocokkan.
          example: bank_transfer
        status_message:
          type: string
          example: midtrans payment notification
        merchant_id:
          type: string
        currency:
          type: string
          example: IDR
        va_numbers:
          type: array
          items:
            type: object
            properties:
              bank:
                type: string
              va_number:
                type: string

    PaymentTtl:
      type: object
      properties:
        expires_at:
          type: string
          format: date-time
        ttl_seconds:
          type: integer
        server_time:
          type: string
          format: date-time

paths:
  # ──────────────────────────────────────────────
  #  AUTHENTICATION
  # ──────────────────────────────────────────────

  /auth/magic-link:
    post:
      tags: [Authentication]
      summary: Request Magic Link (Login)
      operationId: requestMagicLink
      description: |
        Mengirim login link ke email. UI: "Send Login Link" button.
        **Requirement**: FR-31
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
            example:
              email: you@example.com
      responses:
        "200":
          description: Login link sent to email
          content:
            application/json:
              example:
                meta:
                  code: 200
                  message: Login link sent to your email
        "429":
          description: Rate limited — too many requests
          content:
            application/json:
              example:
                meta:
                  code: 429
                  message: Please wait before requesting another link
                data:
                  retry_after: 60

  /auth/magic-link/resend:
    post:
      tags: [Authentication]
      summary: Resend Magic Link
      operationId: resendMagicLink
      description: |
        Kirim ulang login link. UI: "Resend Login Link" button di "Check your inbox" screen.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
            example:
              email: you@example.com
      responses:
        "200":
          description: New login link sent
          content:
            application/json:
              example:
                meta:
                  code: 200
                  message: New login link sent

  /auth/verify:
    get:
      tags: [Authentication]
      summary: Verify Magic Link Token
      operationId: verifyMagicLink
      description: |
        Verifikasi token dari link email. Ini adalah redirect target dari email login link.

        Mengembalikan `redirect_context` bila user kembali ke booking yang sedang berlangsung (BR-09).
        **Requirement**: FR-31, BR-09
      parameters:
        - name: magic_token
          in: cookie
          required: true
          schema:
            type: string
          description: Token dari email link
      responses:
        "200":
          description: Login successful
          headers:
            Set-Cookie:
              schema:
                type: string
              description: "access_token cookie"
          content:
            application/json:
              example:
                meta:
                  code: 200
                  message: Login successful
                data:
                  access_token: eyJhbG...
                  refresh_token: eyJhbG...
                  expires_in: 22740
                  user:
                    id: usr_123
                    email: you@example.com
                    nik: "3171xxxxxxxxxx22"
                  redirect_context:
                    type: booking
                    event_id: evt_konser_a
                    booking_id: RB-00912
                    message: Booking context restored
        "401":
          description: Invalid or expired magic token

  /auth/verify-email:
    get:
      tags: [Authentication]
      summary: Verify Email Address
      operationId: verifyEmail
      description: |
        Mengonfirmasi kepemilikan alamat email setelah registrasi (FR-31).

        **Berbeda dari `GET /auth/verify`**: yang itu adalah login tanpa kata sandi dan
        menerbitkan sesi. Endpoint ini hanya mengisi `accounts.email_verified_at` dan tidak
        menerbitkan token apa pun.

        Akun yang belum terverifikasi **tetap dapat membeli** — verifikasi email hanya
        membuka riwayat pesanan. Yang memblokir pembelian adalah `nik_verified_at IS NULL`.

        Endpoint ini sudah berjalan di `user-service` tetapi tidak pernah masuk kontrak
        sebelum v2.5.

        **Tautan ini kedaluwarsa dalam 15 menit, dan itu bukan jalan buntu — jangan bangun
        endpoint resend untuknya.** `GET /auth/verify` **juga** mengisi `email_verified_at`:
        menebus tautan login membuktikan kendali atas alamat itu, hal yang sama persis yang
        dibuktikan tautan verifikasi. Customer yang tautannya kedaluwarsa cukup meminta magic
        link (`POST /auth/magic-link`) dan login — akunnya terverifikasi sebagai efek
        sampingnya, idempoten (`COALESCE(email_verified_at, now())`).

        Endpoint ini karena itu kenyamanan, bukan satu-satunya jalan: ia melayani customer
        yang ingin mengonfirmasi tanpa login.
        **Requirement**: FR-31
      parameters:
        - name: token
          in: query
          required: true
          description: >
            Token dari tautan email `account.verify`; berlaku **15 menit**, sekali pakai —
            sama dengan TTL tautan login, karena `magic_tokens` memakai satu konstanta untuk
            kedua `purpose`.
          schema:
            type: string
      responses:
        "200":
          description: Email verified
          content:
            application/json:
              example:
                meta:
                  code: 200
                  message: Email verified
                  server_time: "2026-11-03T09:12:00.412Z"
                data:
                  email_verified: true
        "400":
          description: TOKEN_INVALID — token tidak dikenal, sudah dipakai, atau kedaluwarsa

  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Refresh Session
      operationId: refreshSession
      description: |
        Menukar refresh token dengan pasangan token baru.

        Dipanggil klien saat access token mendekati kedaluwarsa, atau setelah
        menerima `401 TOKEN_EXPIRED`.

        Access token berlaku 22740 detik — mencakup penantian antrian dan perjalanan
        930 detik — sehingga endpoint ini **tidak** dipanggil di tengah journey, dan
        juga tidak di ruang tunggu. Ia
        ada untuk sesi yang berumur hari — refresh token berlaku 30 hari — bukan
        untuk menambal token yang terlalu pendek. Sebuah refresh yang gagal di
        halaman pembayaran akan memutus customer, dan NFR-02 melarangnya.

        **Rotasi.** Setiap panggilan mengembalikan refresh token baru dan
        menghanguskan yang dikirim. Klien wajib mengganti salinan simpanannya;
        bila tidak, panggilan berikutnya terbaca sebagai pemutaran ulang.

        **Pemutaran ulang mencabut seluruh keluarga token.** Token sekali-pakai
        yang muncul dua kali berarti kredensial bocor, dan yang memegang mata
        rantai terbaru bisa jadi penyerang — mencabut satu token saja justru
        mempertahankan aksesnya (OAuth 2.0 BCP §4.13).

        Token dikirim di body, bukan header `Authorization`: pada endpoint ini ia
        adalah objek permintaan, dan menjauhkannya dari header itu mencegahnya
        tercatat oleh proxy yang me-log header.

        **Requirement**: FR-31, BR-09, NFR-02, NFR-07
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
                  description: Refresh token opaque dari `GET /auth/verify` atau dari panggilan refresh sebelumnya
            example:
              refresh_token: 8Kq2mN9vL4wX1yB6cF3dH5jG0aZpR7tS
      responses:
        "200":
          description: Session refreshed
          headers:
            Set-Cookie:
              schema:
                type: string
              description: "access_token cookie (HttpOnly, Secure, SameSite=Strict)"
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    type: object
                    properties:
                      code:
                        type: integer
                      message:
                        type: string
                  data:
                    type: object
                    properties:
                      access_token:
                        type: string
                        description: JWT HS256, berlaku `expires_in` detik
                      refresh_token:
                        type: string
                        description: Pengganti yang baru — token yang dikirim sudah hangus
                      expires_in:
                        type: integer
                        description: Masa berlaku access token dalam detik
              example:
                meta:
                  code: 200
                  message: Session refreshed
                data:
                  access_token: eyJhbG...
                  refresh_token: wB3nT8kM2pQ7vF1xJ9cL5gH4dZ6yA0sR
                  expires_in: 22740
        "400":
          description: "`VALIDATION_ERROR` — field `refresh_token` kosong atau absen"
          content:
            application/json:
              example:
                meta:
                  code: 400
                  message: refresh_token is required
                data: {}
        "401":
          description: |
            Sesi tidak dapat diperpanjang. Dua sebab, dibedakan di kode tetapi tidak di pesan:

            - `TOKEN_INVALID` — token **sudah pernah dipakai** (pemutaran ulang; seluruh
              keluarga token dicabut), atau akunnya sudah tidak ada
            - `TOKEN_EXPIRED` — token kedaluwarsa, dicabut, atau tidak dikenal

            Pesannya sama agar penyerang tidak diberi tahu bahwa ia memicu deteksi pencurian.
          content:
            application/json:
              example:
                meta:
                  code: 401
                  message: Session ended; please sign in again
                data: {}

  /auth/register:
    post:
      tags: [Authentication]
      summary: Register Account
      operationId: registerAccount
      description: |
        Buat akun baru dengan email dan NIK.

        NIK diverifikasi ke Dukcapil **sekali di sini** dan terikat permanen ke akun.
        Setelah itu pembelian tidak memanggil Dukcapil lagi untuk NIK pembeli.

        Consent wajib diisi dan tidak boleh pre-checked (UU PDP No. 27/2022).
        **Requirement**: FR-29, FR-30, FR-31
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, nik, consent]
              properties:
                email:
                  type: string
                  format: email
                nik:
                  type: string
                  minLength: 16
                  maxLength: 16
                  description: NIK 16 digit. Wajib. Diverifikasi Dukcapil.
                name:
                  type: string
                consent:
                  type: object
                  required: [accepted, policy_version]
                  properties:
                    accepted:
                      type: boolean
                      description: Persetujuan pemrosesan NIK pihak ketiga. Checkbox tidak boleh pre-checked.
                    policy_version:
                      type: string
                      description: Versi kebijakan privasi yang ditampilkan saat registrasi
            example:
              email: alex@example.com
              nik: "3171xxxxxxxxxx22"
              name: ALEX
              consent:
                accepted: true
                policy_version: "2026-10-01"
      responses:
        "200":
          description: Verification link sent
          content:
            application/json:
              example:
                meta:
                  code: 200
                  message: Verification link sent to your email
                data:
                  user_id: usr_456
        "400":
          description: Validation error (e.g. NIK format)
          content:
            application/json:
              example:
                meta:
                  code: 400
                  message: NIK must be exactly 16 digits
                data: {}
        "409":
          description: NIK sudah terdaftar di akun lain (NIK_ALREADY_REGISTERED)
          content:
            application/json:
              example:
                meta:
                  code: 409
                  message: NIK already registered to another account
                data: {}
        "422":
          description: Consent belum dicentang (CONSENT_REQUIRED)
        "429":
          description: Rate limited — 5 akun baru per IP per jam

