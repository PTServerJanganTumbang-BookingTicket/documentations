  # ──────────────────────────────────────────────
  #  QUEUE
  # ──────────────────────────────────────────────

  /events/{event_id}/queue/join:
    post:
      tags: [Queue]
      summary: Join Queue
      operationId: joinQueue
      description: |
        User bergabung ke antrian. Dipanggil saat klik "Beli Tiket" / "Masuk Antrian".

        **FR-05 — Antrian kosong**: bila `ticket_no == now_serving + 1`, server menunggu hingga
        1 detik sampai tick admission-ctl berikutnya (tiap 500 ms; satu-satunya penulis grant,
        ADR-006 §4.1) memberi grant. Bila grant terbit dalam waktu itu, respons berisi `granted: true` dan
        `grant_token` — klien langsung ke Detail Ticket tanpa membuka SSE stream. Bila belum,
        respons antre biasa; giliran tiba lewat SSE + `GET /queue/me`.

        **Re-entrancy**: user yang sudah di antrian mendapat posisi lama kembali.

        Server meng-set cookie:
        ```
        Set-Cookie: queue_token=qt_xyz789; HttpOnly; Secure; SameSite=Strict; Max-Age={SALE_WINDOW_SECONDS}
        ```
        `Max-Age` DITURUNKAN dari `SALE_WINDOW_SECONDS` — nilai yang sama dengan TTL
        `token:{uuid}` yang dirujuknya — bukan dipatok 7200, supaya cookie dan kunci yang
        dirujuknya tidak pernah kedaluwarsa pada waktu yang berbeda. Ia juga batas ATAS:
        keadaan terminal menghapus kredensial lebih cepat.

        **Urutan pemeriksaan server: rate limit DULU, CAPTCHA kemudian.** Rate limit adalah
        panggilan Redis lokal; verifikasi CAPTCHA adalah round trip eksternal. Membaliknya
        berarti membayar satu panggilan pihak ketiga untuk tiap percobaan yang akhirnya
        ditolak — penyerang yang memilih biaya kita.
        **Requirement**: FR-04, FR-05, FR-10, NFR-05
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: string
          example: evt_konser_a
        - name: X-Device-Id
          in: header
          required: false
          description: >
            Acak 128 bit yang dibuat klien, disimpan server sebagai HMAC(DEVICE_PEPPER, …) pada
            keterlibatan dan dicocokkan pada setiap panggilan ber-grant. WAJIB bila pemanggil
            tidak login — grant tanpa pengikatan tidak dapat diikat belakangan, jadi tamu yang
            tidak mengirimnya ditolak di sini dengan 400 DEVICE_ID_REQUIRED, bukan nanti.
          schema:
            type: string
        - name: Authorization
          in: header
          required: false
          description: >
            `Bearer {access_token}` bila customer login. Satu-satunya tempat di jalur antrian
            yang menerimanya, karena dua hal butuh identitas akun tepat pada saat join:
            penegakan BR-07 lewat acct:{ev}:{account_id}, dan `account_id` pada keterlibatan —
            yang kemudian menjadi `bookings.account_id` pada INSERT saat GRANT, tanpa pernah
            menanyakan klien lagi.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [captcha_token]
              properties:
                captcha_token:
                  type: string
                  description: >
                    Token CAPTCHA TAK TERLIHAT, diperoleh klien SEBELUM gerbang dibuka.
                    Halaman detail event (GET /events/{event_id}) memuat widget-nya —
                    termasuk saat queue_state NOT_OPEN — dan menyegarkan token tiap ~60 detik,
                    sehingga pada sale_starts_at klien sudah memegang token segar dan join
                    hanya membawanya.

                    Mode interaktif (teka-teki visual) TIDAK BOLEH dipakai di endpoint ini:
                    ticket_no berasal dari INCR issued pada saat join, jadi manusia yang
                    butuh tiga detik akan mendapat nomor antrian LEBIH BESAR daripada bot
                    yang menembus layanan pemecah dalam 200 ms. Tantangan interaktif di titik
                    ini MEMBALIK keadilan yang ia lindungi.

                    Berlaku untuk tamu DAN user login — akun hanya berbiaya 5 per IP per jam,
                    jadi mengecualikan login menjadikannya jalur ramah bot.

                    Provider tidak tersedia -> join TETAP DITERIMA (fail-open): CAPTCHA
                    melindungi keadilan, bukan kebenaran. Tidak ada oversell, tidak ada NIK
                    yang lolos, tidak ada uang yang bergerak. Fail-closed di sini mematikan
                    sale sebelum dimulai. CaptchaFailOpenSeconds dialarmkan.
                  example: "0.AbCdEf..."
            example:
              captcha_token: "0.AbCdEf..."
      responses:
        "200":
          description: Joined queue / rejoined existing position
          headers:
            Set-Cookie:
              schema:
                type: string
              description: queue_token HttpOnly cookie
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: "#/components/schemas/Meta"
                  data:
                    $ref: "#/components/schemas/QueueJoinData"
              examples:
                joined:
                  summary: New queue position
                  value:
                    meta:
                      code: 200
                      message: Successfully joined queue
                    data:
                      ticket_no: 32748
                      now_serving: 31500
                      position: 1248
                      queue_token: qt_xyz789
                      sse_url: /queue/stream
                      event:
                        id: evt_konser_a
                        name: Konser A — Jakarta
                rejoined:
                  summary: Rejoined existing position
                  value:
                    meta:
                      code: 200
                      message: Rejoined existing queue position
                    data:
                      ticket_no: 32748
                      now_serving: 31520
                      position: 1228
                      queue_token: qt_xyz789
                      sse_url: /queue/stream
                      rejoined: true
                bypass:
                  summary: Queue empty — granted immediately (FR-05)
                  value:
                    meta:
                      code: 200
                      message: No queue — access granted
                    data:
                      granted: true
                      grant_token: gt_abc123
                      booking_expires_at: "2026-11-10T02:05:00Z"
                      server_time: "2026-11-10T02:00:00Z"
        "400":
          description: CAPTCHA_REQUIRED (captcha_token tidak disertakan) atau DEVICE_ID_REQUIRED
          content:
            application/json:
              examples:
                captcha_required:
                  value:
                    meta: { code: 400, message: CAPTCHA_REQUIRED }
                    data: {}
                device_id_required:
                  summary: Pemanggil anonim tanpa X-Device-Id
                  value:
                    meta: { code: 400, message: DEVICE_ID_REQUIRED }
                    data: {}
        "403":
          description: >
            CAPTCHA_FAILED — token tidak valid, sudah dipakai, atau kedaluwarsa. Klien
            mengambil token baru dan mencoba lagi TANPA mendapat ticket_no, sehingga
            percobaan yang gagal tidak memakan posisi antrian.
        "409":
          description: Sale belum dibuka (queue state SCHEDULED)
          content:
            application/json:
              example:
                meta:
                  code: 409
                  message: Penjualan belum dibuka
                data:
                  queue_state: NOT_OPEN
                  sale_starts_at: "2026-11-10T02:00:00Z"
        "429":
          description: >
            Melewati rl:join:{ip} (20 / 5 menit), atau — bila pemanggil login — batas 3 join
            per akun per menit.
        "503":
          description: Queue full (QUEUE_FULL)
          content:
            application/json:
              example:
                meta:
                  code: 503
                  message: Antrian sedang penuh, silakan coba beberapa saat lagi
                data:
                  queue_state: FULL
                  queue_capacity: 300000

  /events/{event_id}/queue/stream:
    get:
      tags: [Queue]
      summary: Queue Status Stream (SSE)
      operationId: queueStream
      description: |
        **Server-Sent Events** stream untuk update posisi real-time.
        Klien connect setelah berhasil join queue.

        > ⚠️ Endpoint ini dilayani oleh ALB (`events.rusuhtiket.com`), bukan API Gateway.

        **Autentikasi**: Cookie `queue_token` (web — EventSource tidak dapat menyetel header) | `X-Queue-Token` header (mobile). Bukan `Authorization`: slot itu milik sesi akun.
        Token TIDAK pernah dikirim via query string (akan tercatat di access log).

        **Event types yang dikirim server**:

        | Event | Kapan | Payload |
        |---|---|---|
        | *(unnamed, default)* | Snapshot saat connect, tiap `nowServing` berubah, atau 10 detik (heartbeat) | `QueueStreamUpdate` `{nowServing, state, ratePerMin, serverTime}` |
        | `status` | Tiap transisi state: `OPEN → SOLD_OUT`, `SOLD_OUT → OPEN`, `→ CLOSED` | `QueueStreamStatus` `{state, soldOutAt, serverTime}` |
        | `stale` | Data berhenti segar (Redis putus / tanpa broadcast 30 detik), dan saat pulih | `QueueStreamStale` `{stale, reason}` |
        | `sold-out` | Tepat setelah `status {state: CLOSED}` | `QueueStreamSoldOut` `{message}` — klien **WAJIB** `es.close()` |
        | `reconnect` | Task sedang shutdown | Retry jitter 1–15 detik |
        | `: keepalive` | Setiap 15 detik | Komentar SSE (tidak memicu handler) |

        **Snapshot awal** dikirim segera saat koneksi terbuka — posisi utuh tanpa menunggu tick berikutnya (FR-10).

        Semua koneksi event menerima **byte yang identik**. Frontend menghitung
        `position = ticket_no − nowServing` dan estimasi menit dari `ratePerMin`
        (api-contracts §3.5). Bila `nowServing ≥ ticket_no`, klien memanggil `GET /queue/me`.

        Skema `data` tiap event ada di `components/schemas` (`QueueStreamUpdate`,
        `QueueStreamStatus`, `QueueStreamStale`, `QueueStreamSoldOut`) dan dipetakan di
        `x-sse-events` pada respons 200.

        **HTTP 410 Gone** bila event sudah sold out — `EventSource` berhenti permanen.
        **Requirement**: FR-07, FR-08, FR-09, FR-10, BR-10, NFR-06
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: string
          example: evt_konser_a
        - name: X-Queue-Token
          in: header
          description: "Token ruang tunggu — untuk mobile. Web pakai cookie `queue_token`, karena EventSource tidak dapat menyetel header."
          schema:
            type: string
      security:
        - QueueTokenCookie: []
        - QueueTokenHeader: []
      responses:
        "200":
          description: SSE stream opened successfully
          content:
            text/event-stream:
              schema:
                type: string
                description: >
                  Aliran frame SSE (`event:` opsional, `id:` opsional, `data:` JSON). Skema
                  JSON `data` per nama event ada di x-sse-events.
              x-sse-events:
                message:
                  $ref: "#/components/schemas/QueueStreamUpdate"
                status:
                  $ref: "#/components/schemas/QueueStreamStatus"
                stale:
                  $ref: "#/components/schemas/QueueStreamStale"
                sold-out:
                  $ref: "#/components/schemas/QueueStreamSoldOut"
              examples:
                initial_snapshot:
                  summary: Snapshot awal (dikirim segera saat connect)
                  value: |
                    id: 31600
                    data: {"nowServing":31600,"state":"OPEN","ratePerMin":318,"serverTime":"2026-10-24T13:10:00.412Z"}

                position_update:
                  summary: Update posisi (default event)
                  value: |
                    id: 31604
                    data: {"nowServing":31604,"state":"OPEN","ratePerMin":318,"serverTime":"2026-10-24T13:10:01.004Z"}

                status_sold_out:
                  summary: Stok habis (reversibel) — klien tetap tersambung
                  value: |
                    event: status
                    data: {"state":"SOLD_OUT","soldOutAt":"2026-10-24T13:40:12.000Z","serverTime":"2026-10-24T13:40:12.120Z"}

                status_reopened:
                  summary: Stok kembali dari booking kedaluwarsa
                  value: |
                    event: status
                    data: {"state":"OPEN","soldOutAt":null,"serverTime":"2026-10-24T13:44:02.501Z"}

                closed:
                  summary: Sale ditutup permanen — klien WAJIB es.close()
                  value: |
                    event: status
                    data: {"state":"CLOSED","soldOutAt":null,"serverTime":"2026-10-24T13:55:42.000Z"}

                    event: sold-out
                    data: {"message":"Tiket sudah habis"}

                stale:
                  summary: Data antrian basi (Redis putus / ctl diam)
                  value: |
                    event: stale
                    data: {"stale":true,"reason":"no_admission_updates"}

                keepalive:
                  summary: Keepalive comment (15 detik)
                  value: |
                    : keepalive

        "401":
          description: Queue token invalid atau tidak ada
        "409":
          description: Sale belum dibuka (state SCHEDULED)
        "410":
          description: >
            state CLOSED — sale ditutup permanen. EventSource berhenti permanen pada status
            non-200, dan itu disengaja: ia yang mencegah badai reconnect. SOLD_OUT TIDAK
            menjawab 410 — stream tetap dibuka karena stok dapat kembali dari booking yang
            kedaluwarsa; hanya CLOSED, yang disetel SOLD_OUT_HOLD_SECONDS (930 detik) setelah
            sold_out_at, yang memutus.
        "429":
          description: >
            Melewati rl:sse:{ip} (5 koneksi/detik). Rate limit ini duduk di sse-server, bukan
            di API Gateway — endpoint ini satu-satunya yang dilayani ALB, dan ia pengganti WAF
            di gerbang itu.

  /events/{event_id}/queue/me:
    get:
      tags: [Queue]
      summary: Get Queue State (Re-entrancy)
      operationId: getQueueMe
      description: |
        Satu-satunya endpoint yang dipanggil klien saat kembali — setelah refresh, ganti tab,
        atau kembali dari aplikasi bank. Mengembalikan token yang sama selama TTL belum habis.

        Juga dipanggil saat payload SSE menunjukkan `nowServing ≥ ticket_no` (giliran tiba) untuk
        mengambil `grant_token`. Grant pending atau lag replika menjawab `QUEUED` dengan
        `ticket_no ≤ now_serving`, lalu klien mengulang setelah 1 detik.

        `state` yang dikembalikan:

        | State | Halaman tujuan |
        |---|---|
        | `QUEUED` | Waiting Room (lanjutkan SSE) |
        | `GRANTED` | Detail Ticket (countdown mulai) |
        | `SELECTING` | Detail Ticket (countdown dilanjutkan) |
        | `AWAITING_PAYMENT` | Payment Page (countdown dilanjutkan) |
        | `CONFIRMED` | Halaman tiket |
        | `EXPIRED` | Layar expired |

        **Requirement**: FR-08, FR-10, BR-09, NFR-02, NFR-07
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: string
          example: evt_konser_a
      security:
        - QueueTokenCookie: []
        - QueueTokenHeader: []
        - BearerAuth: []
      responses:
        "200":
          description: Current queue/booking state for re-entrancy
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: "#/components/schemas/Meta"
                  data:
                    $ref: "#/components/schemas/QueueStateData"
              examples:
                queued:
                  summary: Masih mengantre
                  value:
                    meta:
                      code: 200
                      message: Success
                    data:
                      state: QUEUED
                      ticket_no: 31842
                      now_serving: 31600
                granted:
                  summary: Giliran tiba — grant_token tersedia
                  value:
                    meta:
                      code: 200
                      message: Success
                    data:
                      state: GRANTED
                      grant_token: gt_abc123
                      booking_expires_at: "2026-10-23T13:15:00Z"
                      server_time: "2026-10-23T13:10:00Z"
                selecting:
                  summary: Sedang memilih tiket
                  value:
                    meta:
                      code: 200
                      message: Success
                    data:
                      state: SELECTING
                      grant_token: gt_abc123
                      booking_id: RB-00912
                      booking_expires_at: "2026-10-23T13:15:00Z"
                      server_time: "2026-10-23T13:10:00Z"
                awaiting_payment:
                  summary: Menunggu pembayaran
                  value:
                    meta:
                      code: 200
                      message: Success
                    data:
                      state: AWAITING_PAYMENT
                      grant_token: gt_abc123
                      booking_id: RB-00912
                      payment_expires_at: "2026-10-23T13:25:00Z"
                      payment_ref: pay_123
                      server_time: "2026-10-23T13:10:00Z"
                confirmed:
                  summary: Booking terkonfirmasi
                  value:
                    meta:
                      code: 200
                      message: Success
                    data:
                      state: CONFIRMED
                      booking_id: RB-00912
                expired:
                  summary: Token kadaluarsa
                  value:
                    meta:
                      code: 200
                      message: Success
                    data:
                      state: EXPIRED
        "401":
          description: Queue token tidak valid atau tidak ada

  /events/{event_id}/queue/serving:
    get:
      tags: [Queue]
      summary: Get Now Serving (Polling Fallback)
      operationId: getNowServing
      description: |
        Fallback polling — dipakai untuk hidrasi awal, jaringan yang memblokir `text/event-stream`,
        atau degraded mode saat tier SSE tidak sehat. **Bukan transport utama.**

        **Tanpa query string** — satu entri CDN per event, `Cache-Control: public, max-age=1`.
        Server tidak tahu posisi pemanggil, jadi server mengirim **seluruh tabel interval**
        (`poll_tiers`) dan klien memilih baris untuk posisinya (ADR-006 §8.5):
        - `1–10` → 1.000 ms
        - `11–100` → 2.000 ms
        - `101–1000` → 5.000 ms
        - `>1000` → 10.000 ms

        `poll_after_ms` adalah default untuk posisi yang tidak diketahui. Klien tidak menanam
        interval sendiri — tabelnya milik server.

        Dalam mode polling, frontend menghitung posisi dan estimasi dengan rumus api-contracts
        §3.5 memakai `now_serving` dan `rate_per_min`, dan membaca `state` untuk SOLD_OUT / CLOSED.
        **Requirement**: FR-07 (fallback), NFR-08
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: string
          example: evt_konser_a
      responses:
        "200":
          description: Current now_serving with server-suggested poll interval
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: "#/components/schemas/Meta"
                  data:
                    $ref: "#/components/schemas/NowServingData"
              example:
                meta:
                  code: 200
                  message: Success
                data:
                  now_serving: 31600
                  rate_per_min: 318
                  state: OPEN
                  server_time: "2026-10-24T13:10:00.412Z"
                  poll_after_ms: 1000
                  poll_tiers:
                    - { max_position: 10, poll_after_ms: 1000 }
                    - { max_position: 100, poll_after_ms: 2000 }
                    - { max_position: 1000, poll_after_ms: 5000 }
                    - { max_position: null, poll_after_ms: 10000 }

  # ──────────────────────────────────────────────
  #  BOOKING — TICKET SELECTION
  # ──────────────────────────────────────────────

  # NOTE: GET /events/{event_id}/tickets MENGUBAH STATE — lihat deskripsinya.
  /events/{event_id}/tickets:
    get:
      tags: [Booking]
      summary: Get Ticket Selection Page
      operationId: getTicketSelection
      description: |
        Menampilkan kategori tiket dengan stok terkini. UI: "Pilih tempatmu di konser."
        Dipanggil setelah klien mendapat `grant_token` dari `GET /queue/me`.

        **ENDPOINT INI MENGUBAH STATE, meskipun ia GET.** Pemuatannya adalah *claim*:
        `bookings.status` berpindah `GRANTED → SELECTING` dan `slot_claimed_at` dicatat.
        Tenggat TIDAK diubah — `booking_expires_at` sudah ditetapkan saat GRANT, dan tidak
        ada grace antrian.

        Transisi ini idempoten: memuat ulang saat status sudah `SELECTING` tidak melakukan
        apa pun, dan status `HELD` / `AWAITING_PAYMENT` tetap merender halaman — customer
        yang menekan Back dari halaman pembayaran harus melihat pilihannya, bukan error.

        Konsekuensinya: **respons ini tidak boleh di-cache dan tidak boleh di-prefetch.**
        `Cache-Control: no-store`. Tanpa transisi ini status `SELECTING` tidak pernah
        tercapai, dan `POST /bookings` — yang menuntutnya — tidak pernah dapat berhasil.
        **Requirement**: FR-11, FR-12, FR-13, FR-17, BR-01, BR-02
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: string
          example: evt_konser_a
        - name: X-Device-Id
          in: header
          required: false
          description: >
            Pengikatan device untuk grant anonim — WAJIB bila pemanggil tidak login (OpenAPI
            tidak dapat menyatakan kewajiban bersyarat). Tidak cocok → 401 DEVICE_MISMATCH.
          schema:
            type: string
      security:
        - GrantToken: []
      responses:
        "200":
          description: Ticket categories with availability and session TTL
          content:
            application/json:
              example:
                meta:
                  code: 200
                  message: Success
                data:
                  event:
                    id: evt_konser_a
                    name: Konser A — Jakarta
                    date: "2026-12-25"
                    venue: GBK, Jakarta
                    image_url: https://cdn.rusuh.id/events/konser-a.jpg
                  session:
                    expires_at: "2026-10-23T13:15:00Z"
                    ttl_seconds: 287
                    server_time: "2026-10-23T13:10:13Z"
                  categories:
                    - id: cat_vip
                      name: VIP
                      description: Lebih dekat dengan energi panggung.
                      price: 1500000
                      available: 12
                      max_per_order: 3
                    - id: cat_festival
                      name: Festival
                      description: Nikmati konser dari area festival.
                      price: 850000
                      available: 240
                      max_per_order: 3
                    - id: cat_tribune
                      name: Tribune
                      description: Area tribun dengan panorama panggung.
                      price: 500000
                      available: 0
                      max_per_order: 0
                  rules:
                    max_tickets_per_order: 3
                    one_nik_per_ticket: true
        "401":
          description: Access token invalid atau expired

  # ──────────────────────────────────────────────
  #  NIK VALIDATION
  # ──────────────────────────────────────────────

  /nik/validate:
    post:
      tags: [NIK]
      summary: Validate NIK
      operationId: validateNik
      description: |
        Validasi NIK ke Dukcapil sebelum submit booking.
        Dipanggil saat input NIK blur atau sebelum menekan "Lanjut ke Pembayaran".

        **Optimasi**: NIK Terdaftar (milik akun) atau NIK Tersimpan tidak memanggil Dukcapil — dijawab dari bukti verifikasi tersimpan. Response menyertakan `source: "registered" | "saved" | "verified"`.

        **Fail closed**: Dukcapil tidak tersedia → `DUKCAPIL_UNAVAILABLE` → pembayaran diblokir, bukan fallback.

        `already_used` bersifat indikatif saja — penegak sebenarnya adalah `SET nik:used NX` pada `POST /bookings`.
        **Requirement**: FR-15a
      parameters:
        - name: X-Device-Id
          in: header
          required: false
          description: >
            Pengikatan device untuk grant anonim — WAJIB bila pemanggil tidak login (OpenAPI
            tidak dapat menyatakan kewajiban bersyarat). Tidak cocok → 401 DEVICE_MISMATCH.
          schema:
            type: string
      security:
        - GrantToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nik]
              properties:
                nik:
                  type: string
                  minLength: 16
                  maxLength: 16
                  description: NIK 16 digit. Hanya NIK yang dikirim ke Dukcapil — tanpa nama atau tanggal lahir.
            example:
              nik: "3171xxxxxxxxxx22"
      responses:
        "200":
          description: Validation result — selalu 200 untuk valid maupun invalid
          content:
            application/json:
              examples:
                valid:
                  summary: NIK valid
                  value:
                    meta:
                      code: 200
                      message: NIK is valid
                    data:
                      nik: "3171xxxxxxxxxx22"
                      valid: true
                      name: JOHN DOE
                      status: ACTIVE
                      source: verified
                not_found:
                  summary: NIK tidak ditemukan di Dukcapil
                  value:
                    meta:
                      code: 200
                      message: NIK not found
                    data:
                      nik: "0000000000000000"
                      valid: false
                      reason: NIK_NOT_FOUND
                inactive:
                  summary: NIK tidak aktif
                  value:
                    meta:
                      code: 200
                      message: NIK is not valid
                    data:
                      valid: false
                      reason: NIK_INACTIVE
                already_used:
                  summary: NIK sudah dipakai untuk event ini (indikatif)
                  value:
                    meta:
                      code: 200
                      message: NIK already used for this event
                    data:
                      valid: true
                      already_used: true
                      reason: NIK_ALREADY_USED
                dukcapil_down:
                  summary: Dukcapil tidak tersedia — pembayaran diblokir
                  value:
                    meta:
                      code: 200
                      message: NIK validation service unavailable
                    data:
                      valid: false
                      reason: DUKCAPIL_UNAVAILABLE
        "400":
          description: Format NIK tidak valid
          content:
            application/json:
              example:
                meta:
                  code: 400
                  message: NIK must be exactly 16 digits
                data: {}
        "429":
          description: Rate limited
          content:
            application/json:
              example:
                meta:
                  code: 429
                  message: Please wait before validating another NIK
                data:
                  retry_after: 5

  # ──────────────────────────────────────────────
  #  BOOKING
  # ──────────────────────────────────────────────

  /bookings:
    post:
      tags: [Booking]
      summary: Create Booking
      operationId: createBooking
      description: |
        Submit pemilihan tiket. UI: tombol "Lanjut ke Pembayaran".

        **Memulai TTL pembayaran**: `payment_expires_at = held_at + 10 menit`. Setiap customer mendapat 10 menit penuh.

        **Hold all-or-nothing**: stok seluruh kategori diperiksa sebelum satu pun dikurangi, dalam satu skrip Lua atomik.

        **Multi-kategori diizinkan**: misalnya 1 VIP + 1 Festival + 1 Tribune. Batas 3 tiket per transaksi secara total, bukan per kategori.

        **1 NIK = 1 kursi** (BR-02): `holder_email` adalah alamat tujuan e-tiket kursi itu (FR-26).

        **Idempoten**: submit ulang mengembalikan booking yang ada — tidak ada hold kedua.
        **Requirement**: FR-13, FR-14, FR-15, FR-16, NFR-04, BR-01, BR-02
      parameters:
        - name: X-Device-Id
          in: header
          required: false
          description: >
            Pengikatan device untuk grant anonim — WAJIB bila pemanggil tidak login (OpenAPI
            tidak dapat menyatakan kewajiban bersyarat). Tidak cocok → 401 DEVICE_MISMATCH.
          schema:
            type: string
      security:
        - GrantToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event_id, tickets, contact_email, terms_version]
              properties:
                event_id:
                  type: string
                tickets:
                  type: array
                  minItems: 1
                  maxItems: 3
                  items:
                    type: object
                    required: [category_id, nik, holder_email]
                    properties:
                      category_id:
                        type: string
                      nik:
                        type: string
                        minLength: 16
                        maxLength: 16
                      holder_email:
                        type: string
                        format: email
                        description: Alamat tujuan e-tiket untuk pemegang NIK ini
                contact_email:
                  type: string
                  format: email
                  description: Email kontak pembeli utama
                terms_version:
                  type: string
                  description: Versi T&C yang ditampilkan dan disetujui
            example:
              event_id: evt_konser_a
              tickets:
                - category_id: cat_vip
                  nik: "3171xxxxxxxxxx22"
                  holder_email: buyer@example.com
                - category_id: cat_festival
                  nik: "3171xxxxxxxxxx33"
                  holder_email: friend@example.com
              contact_email: buyer@example.com
              terms_version: "2026-10-01"
      responses:
        "201":
          description: Booking created, stock held, payment TTL started
          content:
            application/json:
              example:
                meta:
                  code: 201
                  message: Booking created successfully
                data:
                  booking_id: RB-00912
                  status: PENDING_PAYMENT
                  event:
                    id: evt_konser_a
                    name: Konser A — Jakarta
                    date: "2026-12-25"
                    venue: GBK, Jakarta
                  tickets:
                    - category: VIP
                      price: 1500000
                      nik_masked: "3171********xx22"
                    - category: Festival
                      price: 850000
                      nik_masked: "3171********xx33"
                  summary:
                    subtotal: 2350000
                    service_fee: 0
                    total: 2350000
                  payment_ttl:
                    expires_at: "2026-10-23T13:25:00Z"
                    ttl_seconds: 600
                    server_time: "2026-10-23T13:15:00Z"
                  redirect_url: /bookings/RB-00912/payment
        "400":
          description: Validation error
          content:
            application/json:
              examples:
                max_tickets:
                  summary: Melebihi batas 3 tiket
                  value:
                    meta:
                      code: 400
                      message: Maximum 3 tickets per order
                    data: {}
                nik_invalid:
                  summary: NIK tidak valid di Dukcapil
                  value:
                    meta:
                      code: 400
                      message: NIK 3171********xx22 tidak terdaftar di Dukcapil
                    data: {}
        "409":
          description: NIK sudah dipakai atau stok tidak cukup
          content:
            application/json:
              examples:
                nik_taken:
                  summary: NIK sudah digunakan untuk event ini
                  value:
                    meta:
                      code: 409
                      message: NIK 3171xxxxxxxxxx22 sudah digunakan untuk event ini
                    data: {}
                no_stock:
                  summary: Stok tidak mencukupi
                  value:
                    meta:
                      code: 409
                      message: Stok VIP tidak mencukupi
                    data:
                      available: 1
                      requested: 2

  /bookings/{booking_id}:
    get:
      tags: [Booking]
